        success_metrics:
          - "App install rate: >40% of active users"
          - "Push notification opt-in rate: >70%"
          - "Push notification open rate: >30%"

      # --- Engagement & Retention ---

      - id: FEAT-037
        name: "Care Receiver Onboarding Checklist"
        priority: P1
        status: not_started
        classification: MVP
        epic: "Growth & Retention"
        estimated_effort: 3

        user_story: |
          As a new care receiver, I want a guided onboarding process
          so that I quickly complete setup and make my first booking.

        description: |
          Interactive onboarding checklist on dashboard guiding care receivers
          through essential setup steps to first booking.

        acceptance_criteria:
          - "Checklist visible until all steps complete"
          - "Dismissible but returns on next login"
          - "Analytics track completion rate per step (identify drop-off points)"
          - "Each step links to relevant page"
          - "Progress bar shows completion percentage"

        user_journey:
          - "Care receiver completes registration"
          - "Lands on dashboard with checklist"
          - "Sees: 1 of 5 steps complete (email verified)"
          - "Clicks next step: Add emergency contact"
          - "Completes emergency contact form"
          - "Returns to dashboard, sees: 2 of 5 steps complete"
          - "Continues through verification, payment, first booking"
          - "Completion celebration message"

        compliance_requirements: []

        dependencies:
          - "FEAT-001: Care Receiver/Family Registration"
          - "FEAT-013: Care Receiver Identity Verification"
          - "FEAT-021: Care Receiver Payment Setup"

        success_metrics:
          - "Checklist completion rate: >70%"
          - "Time to first booking: <7 days median"
          - "Drop-off analysis: Identify bottleneck steps"

      - id: FEAT-038
        name: "Caregiver Onboarding Checklist"
        priority: P1
        status: not_started
        classification: MVP
        epic: "Growth & Retention"
        estimated_effort: 3

        user_story: |
          As a new caregiver, I want a guided onboarding process
          so that I complete profile setup and start receiving bookings quickly.

        description: |
          Interactive onboarding checklist guiding caregivers through profile
          completion, verification, and approval process.

        acceptance_criteria:
          - "Checklist shows 7 steps (email verified through first booking accepted)"
          - "Pending approval step shows estimated review time"
          - "Notifications when admin approves profile"
          - "Analytics track completion rate per step"

        user_journey:
          - "Caregiver completes registration"
          - "Lands on dashboard with checklist"
          - "Works through steps: profile, verification, bank account, availability"
          - "Submits for admin review (step 6)"
          - "Waits for approval (receives notification)"
          - "Profile approved, checklist shows: 6 of 7 complete"
          - "Accepts first booking, checklist complete"

        compliance_requirements: []

        dependencies:
          - "FEAT-002: Caregiver Registration"
          - "FEAT-014: Caregiver Enhanced Identity Verification"
          - "FEAT-023: Caregiver Payout Setup"
          - "FEAT-029: Caregiver Application Review"

        success_metrics:
          - "Checklist completion rate: >65%"
          - "Time to profile approval: <48 hours"
          - "Time to first booking accepted: <14 days median"

      - id: FEAT-039
        name: "Recurring Bookings"
        priority: P2
        status: not_started
        classification: Phase 2
        epic: "Growth & Retention"
        estimated_effort: 8

        user_story: |
          As a care receiver, I want to schedule regular weekly bookings
          so that I don't have to manually book my preferred caregiver each time.

        description: |
          Recurring booking functionality allowing care receivers to schedule
          regular sessions with the same caregiver.

        acceptance_criteria:
          - "Offered after successful first booking"
          - "Define recurring pattern (e.g., Every Tuesday 2-5pm)"
          - "Set end date or ongoing (until cancelled)"
          - "Both parties can cancel recurring series"
          - "Individual instances can be cancelled per standard policy"
          - "Optional pricing discount for recurring bookings"

        user_journey:
          - "Care receiver completes first booking with caregiver"
          - "Sees prompt: Book weekly recurring sessions?"
          - "Clicks Set Up Recurring"
          - "Selects day of week and time (pre-filled from first booking)"
          - "Sets duration (ongoing or specific end date)"
          - "Confirms recurring booking"
          - "Caregiver accepts recurring series"
          - "Bookings created automatically each week"
          - "Either party can pause or cancel series"

        safeguarding_impact: |
          Recurring bookings build trust and routine but require careful monitoring
          for signs of exploitation or dependency.

        compliance_requirements:
          - "Consumer Rights Act: Clear terms for cancelling recurring bookings"

        dependencies:
          - "FEAT-009: Booking Lifecycle Management"
          - "Recurring booking scheduler"

        success_metrics:
          - "Recurring booking adoption: >30% of users with 3+ completed bookings"
          - "Recurring booking retention: >80% continue for 3+ months"
          - "Revenue from recurring: Target 50% of total GMV"

        open_questions:
          - "Should we offer pricing discount for recurring bookings?"
          - "How do we handle caregiver availability changes for recurring bookings?"

      - id: FEAT-040
        name: "Family Shared Accounts"
        priority: P0
        status: not_started
        classification: MVP
        epic: "Growth & Retention"
        estimated_effort: 13

        user_story: |
          As a family member, I want to collaborate with other family members
          so that we can jointly manage care for our elderly relative.

        description: |
          Complex role-based access control allowing multiple family members to
          manage a care receiver's account with different permission levels.

        acceptance_criteria:
          - "Primary account holder can invite family members via email"
          - "Role-based permissions: Admin (full access), Booker (can book/cancel), Viewer (view only)"
          - "Identity verification required for all family members"
          - "Audit trail shows which family member took each action"
          - "Family members can communicate via shared notes"
          - "Care receiver can revoke access at any time"

        user_journey:
          - "Primary family member (daughter) creates account on behalf of mother"
          - "Completes mother's profile"
          - "Navigates to Family Access settings"
          - "Invites brother via email with Admin role"
          - "Brother receives invitation, creates account, verifies identity"
          - "Brother can now book caregivers and manage bookings"
          - "Both can see all bookings and audit trail"

        safeguarding_impact: |
          Multiple family members provide oversight and reduce risk of single
          point of failure. Audit trail prevents disputes and enables investigation
          if concerns arise about family member behavior.

        compliance_requirements:
          - "Care Act 2014: Ensure care receiver consent for family access"
          - "Mental Capacity Act 2005: Respect care receiver's autonomy"
          - "GDPR: Family members are data processors, clear roles defined"

        dependencies:
          - "FEAT-064: Audit Logging"
          - "Complex RBAC implementation"
          - "Family invitation system"

        success_metrics:
          - "Accounts with 2+ family members: Target 60% within 6 months"
          - "Average family members per account: 2.5"
          - "Conflict resolution required: <1% of family accounts"

  # ==========================================
  # EPIC 6: TECHNICAL FOUNDATIONS
  # ==========================================

  - id: EPIC-006
    name: "Technical Foundations"
    description: "Core infrastructure, authentication, database, APIs, and compliance"
    features:

      # --- Infrastructure ---

      - id: FEAT-041
        name: "User Authentication & Authorization"
        priority: P0
        status: not_started
        classification: MVP
        epic: "Technical Foundations"
        estimated_effort: 8

        user_story: |
          As a platform, I need secure authentication and authorization
          so that only authorized users can access their data and features.

        description: |
          Complete authentication system with email/password, session management,
          password reset, email verification, and role-based access control.

        acceptance_criteria:
          - "Passwords minimum 8 characters, require uppercase, lowercase, number"
          - "Password reset link single-use, expires in 1 hour"
          - "Sessions invalidated on password change"
          - "RBAC enforced at API level (not just UI)"
          - "Admin accounts require 2FA (TOTP app)"
          - "Account lockout after 5 failed login attempts (10-minute lockout)"

        user_journey:
          - "User registers with email/password"
          - "Receives verification email"
          - "Clicks verification link (24-hour expiry)"
          - "Account activated"
          - "Logs in with credentials"
          - "Session created (30-day expiry)"
          - "Can access role-appropriate features"

        safeguarding_impact: |
          Strong authentication prevents unauthorized access to vulnerable
          adult data and financial information.

        compliance_requirements:
          - "GDPR: Secure user authentication required"
          - "Cyber Essentials: Password security standards"

        dependencies:
          - "Session storage (Redis)"
          - "Email service (password reset, verification)"
          - "Password hashing (bcrypt, cost factor 12)"

        success_metrics:
          - "Login success rate: >95%"
          - "Password reset completion rate: >80%"
          - "Account compromise rate: 0% (target)"

      - id: FEAT-042
        name: "Database Schema"
        priority: P0
        status: not_started
        classification: MVP
        epic: "Technical Foundations"
        estimated_effort: 5

        user_story: |
          As a platform, I need a well-designed database schema
          so that data is stored efficiently, securely, and with referential integrity.

        description: |
          PostgreSQL database schema with all core tables, foreign key constraints,
          indexes, and encryption for sensitive data.

        acceptance_criteria:
          - "Foreign key constraints enforced"
          - "Indexes on frequently queried columns (email, postcode, created_at)"
          - "Soft deletes for GDPR compliance (retain for legal reasons)"
          - "Encrypted columns for sensitive data (payment details tokenized by Stripe)"
          - "Migration system for schema changes"

        user_journey:
          - "N/A - Technical implementation"

        safeguarding_impact: |
          Audit trail tables enable investigation of concerns. Soft deletes
          preserve evidence even when users delete accounts.

        compliance_requirements:
          - "GDPR: Data minimization, secure storage"
          - "Audit requirements: Retain records per retention policy"

        dependencies:
          - "PostgreSQL database"
          - "Database migration tool (e.g., Flyway, Liquibase)"

        success_metrics:
          - "Query performance: 95th percentile <100ms"
          - "Database uptime: >99.9%"

      - id: FEAT-043
        name: "API Design"
        priority: P0
        status: not_started
        classification: MVP
        epic: "Technical Foundations"
        estimated_effort: 5

        user_story: |
          As a developer, I need a well-designed RESTful API
          so that frontend and future integrations can reliably interact with the platform.

        description: |
          RESTful API with consistent design, authentication, rate limiting,
          pagination, and error handling.

        acceptance_criteria:
          - "RESTful conventions (GET/POST/PATCH/DELETE)"
          - "Authentication: Bearer token (JWT) or session cookie"
          - "Rate limiting: 100 requests/minute per user"
          - "Pagination: ?page=1&limit=20 (max 100)"
          - "Consistent error responses: {error, code}"
          - "CORS: Restrict to platform domain"

        user_journey:
          - "N/A - Technical implementation"

        safeguarding_impact: |
          Rate limiting prevents abuse and automated attacks.

        compliance_requirements:
          - "API security: OWASP API Security Top 10 compliance"

        dependencies:
          - "API framework (e.g., Express, FastAPI, Rails)"
          - "Rate limiting middleware"

        success_metrics:
          - "API uptime: >99.9%"
          - "Average response time: <200ms"
          - "Error rate: <1%"

      - id: FEAT-044
        name: "Data Retention & GDPR"
        priority: P0
        status: not_started
        classification: MVP
        epic: "Technical Foundations"
        estimated_effort: 8

        user_story: |
          As a platform user, I want control over my personal data
          so that I can exercise my GDPR rights (access, portability, erasure).

        description: |
          GDPR compliance features including data export, account deletion,
          consent management, and documented retention policies.

        acceptance_criteria:
          - "Privacy policy reviewed by UK GDPR lawyer"
          - "Data export includes all personal data (complete SAR response)"
          - "Account deletion anonymizes data per retention schedule"
          - "Audit log tracks data access (admin views)"
          - "Clear consent checkboxes (processing vs. marketing)"

        user_journey:
          - "User navigates to Privacy Settings"
          - "Clicks Download My Data"
          - "Receives JSON export within 24 hours"
          - "Alternatively, clicks Delete My Account"
          - "Sees warning about 30-day grace period"
          - "Confirms deletion"
          - "Account deactivated immediately, data anonymized after 30 days"

        safeguarding_impact: |
          Balance between GDPR rights and safeguarding requirements (retain
          evidence of concerns even if user requests deletion).

        compliance_requirements:
          - "UK GDPR: All rights implemented (access, rectification, erasure, portability)"
          - "Data Protection Act 2018: Lawful basis documented"
          - "ICO guidance: Privacy policy, consent, retention"

        dependencies:
          - "Legal review of privacy policy and terms"
          - "Data export generation"
          - "Deletion scheduler"

        success_metrics:
          - "SAR response time: <30 days (legal requirement)"
          - "Deletion completion: 100% within 30 days"
          - "ICO complaints: 0 (target)"

      - id: FEAT-045
        name: "Monitoring & Logging"
        priority: P1
        status: not_started
        classification: MVP
        epic: "Technical Foundations"
        estimated_effort: 5

        user_story: |
          As a platform engineer, I need comprehensive monitoring and logging
          so that I can detect and resolve issues before they impact users.

        description: |
          Application monitoring, error tracking, performance monitoring, uptime
          monitoring, and structured logging with retention policies.

        acceptance_criteria:
          - "Errors automatically reported to Sentry with user context"
          - "Critical errors alert on-call engineer (PagerDuty)"
          - "Logs retained 90 days (compliance)"
          - "Logs do not contain PII (redact sensitive data)"
          - "Uptime monitoring checks every 1 minute"

        user_journey:
          - "N/A - Technical implementation"

        safeguarding_impact: |
          Monitoring enables rapid detection of platform issues that could
          impact vulnerable adults (e.g., payment failures, messaging outages).

        compliance_requirements:
          - "GDPR: Logs must not contain unnecessary PII"
          - "Audit requirements: Retain security logs per policy"

        dependencies:
          - "Error tracking (Sentry or Rollbar)"
          - "Performance monitoring (Datadog or New Relic)"
          - "Uptime monitoring (Pingdom or UptimeRobot)"
          - "Logging infrastructure (CloudWatch, Splunk)"

        success_metrics:
          - "Error detection time: <5 minutes"
          - "Mean time to resolution (MTTR): <2 hours"
          - "False positive alert rate: <10%"

