  # ==========================================
  # EPIC 5: GROWTH & RETENTION
  # ==========================================

  - id: EPIC-005
    name: "Growth & Retention"
    description: "Marketing, SEO, notifications, onboarding, and engagement features"
    features:

      # --- Marketing & SEO ---

      - id: FEAT-032
        name: "Public Website & Landing Pages"
        priority: P0
        status: not_started
        classification: MVP
        epic: "Growth & Retention"
        estimated_effort: 8

        user_story: |
