# MVP Product Backlog
# Generated: 2026-01-31
# Status: MVP Systems Only (SYS-01 through SYS-22)
# Compliance: UK Care Act 2014, GDPR, CQC, Safeguarding

epics:
  - id: EPIC-01
    title: User Management & Authentication
    system_code: SYS-01
    priority: P0
    capabilities:
      - Secure user registration and authentication
      - Role-based access control (Care Receiver, Family Member, Caregiver, Admin)
      - Phone verification for identity assurance
      - Session management and password security
    stories:
      - id: STORY-01-01
        title: Care Receiver Registration
        user_story: "As a care receiver, I want to register an account with my email and phone number so that I can search for and book caregivers."
        priority: P0
        compliance_tags: [GDPR, Care Act]
        acceptance_criteria:
          - Care receiver can register with email, password, phone number, first name, last name
          - Email validation performed (valid format, not already registered)
          - Password must meet security requirements (min 8 chars, uppercase, lowercase, number)
          - Phone number verified via SMS code before registration completes
          - Registration triggers GDPR consent capture (Terms of Service, Privacy Policy)
          - User role automatically set to "care_receiver"
          - Audit log created for registration event with timestamp and IP address

      - id: STORY-01-02
        title: Family Member Registration
        user_story: "As a family member, I want to register an account so that I can help my elderly relative find and manage care."
        priority: P0
        compliance_tags: [GDPR, Safeguarding]
        acceptance_criteria:
          - Family member can register with email, password, phone number, first name, last name
          - Email and phone verification required (same as care receiver)
          - User role automatically set to "family_member"
          - Family member cannot book care until linked to care receiver account
          - Registration audit logged with relationship context (pending linkage)
          - GDPR consent captured for family member's own data processing

      - id: STORY-01-03
        title: Caregiver Registration
        user_story: "As a professional caregiver, I want to register an account so that I can offer my services and receive booking requests."
        priority: P0
        compliance_tags: [GDPR, Safeguarding, DBS]
        acceptance_criteria:
          - Caregiver can register with email, password, phone number, first name, last name
          - Email and phone verification required
          - User role automatically set to "caregiver"
          - Caregiver account marked "pending_verification" (cannot receive bookings until verified)
          - Registration triggers caregiver application workflow
          - Caregiver shown message that verification required before accepting bookings
          - Audit log includes caregiver registration timestamp for compliance tracking

      - id: STORY-01-04
        title: Phone Verification
        user_story: "As a user registering on the platform, I want to verify my phone number via SMS code so that the platform confirms my identity."
        priority: P0
        compliance_tags: [Safeguarding, Identity Verification]
        acceptance_criteria:
          - System sends 6-digit SMS code to provided phone number
          - User can enter code within 10 minutes (code expires after)
          - User can request resend code (max 3 attempts per hour to prevent abuse)
          - Phone number marked "verified" only after code validated
          - Failed verification attempts logged for fraud monitoring
          - Phone number cannot be reused across multiple accounts
          - Audit trail includes phone verification timestamp and method

      - id: STORY-01-05
        title: Secure Login
        user_story: "As a user, I want to log in securely with my email and password so that only I can access my account."
        priority: P0
        compliance_tags: [GDPR, Security]
        acceptance_criteria:
          - User can log in with verified email and password
          - Password encrypted at rest (bcrypt with salt)
          - Failed login attempts tracked (lock account after 5 failed attempts in 15 minutes)
          - Locked accounts require password reset or admin unlock
          - Successful login creates session token (JWT) with 24-hour expiry
          - Audit log records login timestamp, IP address, user agent
          - User shown last login timestamp for fraud detection

      - id: STORY-01-06
        title: Password Reset
        user_story: "As a user, I want to reset my password via email link so that I can regain access if I forget my password."
        priority: P0
        compliance_tags: [Security]
        acceptance_criteria:
          - User can request password reset from login page
          - System sends password reset link to verified email
          - Reset link expires after 1 hour
          - User can set new password (must meet security requirements)
          - Old password invalidated immediately after reset
          - All active sessions terminated after password reset (force re-login)
          - Audit log records password reset event with timestamp

      - id: STORY-01-07
        title: Role-Based Access Control (RBAC)
        user_story: "As a platform admin, I want to enforce role-based permissions so that users can only access features appropriate to their role."
        priority: P0
        compliance_tags: [Safeguarding, Security]
        acceptance_criteria:
          - Care receivers can search caregivers, create bookings, send messages, leave reviews
          - Family members can perform care receiver actions only for linked accounts
          - Caregivers can update profile, set availability, accept bookings, receive payments
          - Admins can access admin dashboard, verify caregivers, manage reports
          - Unauthorized access attempts blocked (403 Forbidden response)
          - Audit log records all authorization failures with user ID and attempted action
          - Permissions checked on every API request (server-side enforcement)

      - id: STORY-01-08
        title: Session Management
        user_story: "As a user, I want my session to remain active while I use the platform but expire after inactivity so that my account stays secure."
        priority: P0
        compliance_tags: [Security, GDPR]
        acceptance_criteria:
          - Session tokens expire after 24 hours of inactivity
          - User can manually log out (invalidates session immediately)
          - User shown warning 5 minutes before session expiry
          - Expired sessions redirect to login page
          - Session data includes user ID, role, expiry timestamp
          - Audit log records session creation and termination events
          - User can view active sessions in account settings (future enhancement noted)

  - id: EPIC-02
    title: Caregiver Capability & Verification System
    system_code: SYS-02
    priority: P0
    capabilities:
      - Medical condition experience profiling
      - Care skills and qualifications registry
      - Service type definition (companionship, personal care, medical support)
      - Admin verification workflow for caregiver capabilities
      - Search indexing for capability-based matching
    stories:
      - id: STORY-02-01
        title: Medical Condition Experience Profile
        user_story: "As a caregiver, I want to specify which medical conditions I have experience with so that I am matched with care receivers I can safely support."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Caregiver can select medical conditions from standardized list (dementia, Parkinson's, diabetes, stroke recovery, mobility impairment, etc.)
          - For each condition, caregiver specifies years of experience (0-1, 1-3, 3-5, 5-10, 10+ years)
          - Caregiver can add notes explaining specific experience (e.g., "Supported 3 clients with advanced Parkinson's including dyskinesia management")
          - Medical condition selections marked "unverified" until admin reviews evidence
          - Unverified conditions do not appear in search results
          - Audit log tracks condition additions and verification status changes

      - id: STORY-02-02
        title: Care Skills Profile
        user_story: "As a caregiver, I want to list my care skills so that care receivers understand what I can help with."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Caregiver can select care skills from standardized list (personal care, medication prompting, meal preparation, mobility assistance, companionship, light housekeeping, etc.)
          - Each skill categorized by risk level (low risk: companionship, high risk: personal care)
          - High-risk skills require verification before visible in search
          - Caregiver can add notes for each skill (e.g., "Trained in safe manual handling techniques")
          - Skills marked "verified" or "unverified" with verification badge
          - Audit log tracks skill additions and verification events

      - id: STORY-02-03
        title: Qualifications & Training Registry
        user_story: "As a caregiver, I want to upload my care qualifications so that care receivers can verify my training."
        priority: P0
        compliance_tags: [Safeguarding, CQC]
        acceptance_criteria:
          - Caregiver can upload qualification certificates (PDF, JPG, PNG)
          - Supported qualifications include NVQ Level 2/3 Health & Social Care, First Aid, Safeguarding Training, Manual Handling, Medication Administration
          - For each qualification, caregiver specifies issuing body, date obtained, expiry date (if applicable)
          - Expired qualifications flagged automatically
          - Qualifications marked "pending_verification" until admin reviews certificate
          - Admin can approve or reject qualification with reason
          - Verified qualifications shown with badge on caregiver profile
          - Audit log tracks qualification uploads, verification decisions, and expiry warnings

      - id: STORY-02-04
        title: Service Type Definition
        user_story: "As a caregiver, I want to specify which service types I offer so that I receive relevant booking requests."
        priority: P0
        compliance_tags: [Safeguarding, DBS]
        acceptance_criteria:
          - Caregiver can select service types (companionship, personal care, medical condition support)
          - Personal care service type requires enhanced DBS check verification
          - Medical condition support requires relevant qualifications verification
          - Caregiver cannot enable personal care service type until DBS verified
          - Service types shown on caregiver profile with verification badges
          - Audit log tracks service type changes and verification status

      - id: STORY-02-05
        title: Capability Verification Workflow (Admin)
        user_story: "As an admin, I want to review and verify caregiver capabilities so that only qualified caregivers are matched with vulnerable adults."
        priority: P0
        compliance_tags: [Safeguarding, CQC]
        acceptance_criteria:
          - Admin can view pending verification queue for caregiver capabilities
          - Admin can review uploaded evidence (certificates, training records, references)
          - Admin can approve or reject each capability with reason (e.g., "Certificate expired" or "Qualification not recognized")
          - Rejected capabilities trigger email to caregiver with feedback
          - Approved capabilities immediately visible in search results
          - Admin can revoke previously verified capability if evidence invalid
          - Audit log records all verification decisions with admin ID, timestamp, reason

      - id: STORY-02-06
        title: Capability-Based Search Indexing
        user_story: "As a care receiver, I want search results to only show caregivers with verified capabilities matching my needs so that I find safe, qualified care."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Search index includes only verified medical conditions, skills, qualifications
          - Unverified capabilities excluded from search matching
          - Search results ranked by capability match strength (exact condition match ranks higher)
          - Caregiver profiles display verification badges for each capability
          - Search filters enforce verification status (cannot filter for unverified capability)
          - Audit log tracks which capabilities influenced each search result

  - id: EPIC-03
    title: Medical Condition & Care Skills Matching
    system_code: SYS-03
    priority: P0
    capabilities:
      - Care receiver care needs profile
      - Medical condition matching engine
      - Care skills matching engine
      - Qualification requirement enforcement
    stories:
      - id: STORY-03-01
        title: Care Receiver Care Needs Profile
        user_story: "As a care receiver, I want to document my medical conditions and care needs so that I am matched with caregivers who can safely support me."
        priority: P0
        compliance_tags: [Safeguarding, Care Act, GDPR]
        acceptance_criteria:
          - Care receiver can select medical conditions from standardized list (same as caregiver conditions)
          - Care receiver can specify severity level for each condition (mild, moderate, severe)
          - Care receiver can select required care skills (medication prompting, mobility assistance, personal care, companionship)
          - Care receiver can add notes about specific needs (e.g., "Requires hoist for transfers")
          - Care needs profile saved securely (encrypted health data per GDPR)
          - Profile shown to caregivers only after booking request initiated
          - Audit log tracks care needs profile creation and updates

      - id: STORY-03-02
        title: Medical Condition Matching Engine
        user_story: "As a care receiver, I want to see only caregivers with experience in my medical conditions so that I find safe, appropriate care."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Search results filter caregivers by medical condition match
          - Caregiver must have verified experience in ALL care receiver's listed conditions
          - Caregivers without verified condition experience excluded from search results
          - Search results show match score (percentage of conditions matched)
          - Care receiver can override strict matching (with warning about safety risk)
          - Audit log records condition matching decisions for each search

      - id: STORY-03-03
        title: Care Skills Matching Engine
        user_story: "As a care receiver, I want to see only caregivers with the skills I need so that I find caregivers who can help with my daily activities."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Search results filter caregivers by required care skills
          - Caregiver must have verified skills for ALL care receiver's required skills
          - High-risk skills (personal care) require admin verification before matching
          - Search results show skill match score
          - Care receiver can view caregiver's skill verification status
          - Audit log records skill matching for each search result

      - id: STORY-03-04
        title: Qualification Requirement Enforcement
        user_story: "As a platform, I want to enforce qualification requirements for high-risk care so that vulnerable adults are protected from unqualified caregivers."
        priority: P0
        compliance_tags: [Safeguarding, CQC]
        acceptance_criteria:
          - Personal care bookings require caregiver to have First Aid and Manual Handling qualifications
          - Medication prompting requires Safeguarding Training qualification
          - Hoisting/transfers require Manual Handling qualification
          - Caregivers without required qualifications cannot accept booking request
          - Booking request shows "qualification requirements not met" warning if attempted
          - Audit log records qualification requirement enforcement events
          - Admin can configure qualification requirements per service type

  - id: EPIC-04
    title: Discovery & Advanced Search
    system_code: SYS-04
    priority: P0
    capabilities:
      - Location-based caregiver search
      - Advanced filtering (medical conditions, skills, DBS status, availability)
      - Caregiver profile visibility rules
    stories:
      - id: STORY-04-01
        title: Location-Based Caregiver Search
        user_story: "As a care receiver, I want to search for caregivers near my location so that I find caregivers who can travel to me."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Care receiver enters postcode or allows geolocation access
          - Search returns caregivers within configurable radius (5, 10, 15, 20 miles)
          - Search results sorted by distance (nearest first)
          - Caregiver distance shown on search results (e.g., "2.3 miles away")
          - Search respects caregiver's travel radius preference (caregiver sets max travel distance)
          - Caregivers outside travel radius excluded from results
          - Audit log tracks search location and radius for each search

      - id: STORY-04-02
        title: Advanced Filtering
        user_story: "As a care receiver, I want to filter caregivers by medical condition experience, DBS status, and availability so that I find caregivers who meet my specific needs."
        priority: P0
        compliance_tags: [Safeguarding, DBS]
        acceptance_criteria:
          - Care receiver can filter by medical conditions (multi-select)
          - Care receiver can filter by care skills (multi-select)
          - Care receiver can filter by DBS status (enhanced DBS only)
          - Care receiver can filter by availability (date range, hourly/daily/live-in)
          - Care receiver can filter by gender (only for personal care - see GD-10)
          - All filters applied as AND conditions (caregiver must match all)
          - Filter selections persist during session (reset on logout)
          - Audit log tracks filter usage for product analytics

      - id: STORY-04-03
        title: Caregiver Profile Visibility Rules
        user_story: "As a platform, I want to hide unverified caregivers from search results so that care receivers only see safe, verified caregivers."
        priority: P0
        compliance_tags: [Safeguarding, DBS]
        acceptance_criteria:
          - Caregivers without verified DBS check hidden from all search results
          - Caregivers without verified identity hidden from search results
          - Caregivers with "suspended" status hidden from search results
          - Caregivers who haven't set availability hidden from search results
          - Caregiver profiles show verification badges (DBS verified, Identity verified, Qualifications verified)
          - Admin can manually hide caregiver from search (safeguarding action)
          - Audit log tracks visibility rule enforcement for each search result

      - id: STORY-04-04
        title: Caregiver Profile View
        user_story: "As a care receiver, I want to view a caregiver's full profile so that I can assess their experience and suitability."
        priority: P0
        compliance_tags: [Safeguarding, Transparency]
        acceptance_criteria:
          - Profile displays caregiver name, photo, bio, years of experience
          - Profile shows verified medical conditions with years of experience
          - Profile shows verified care skills with verification badges
          - Profile shows verified qualifications (with issuing body and date)
          - Profile shows DBS status (Enhanced DBS verified, date checked)
          - Profile shows average rating and number of reviews
          - Profile shows hourly rate, availability calendar
          - Care receiver can send message or request booking from profile
          - Audit log tracks profile views (for caregiver analytics)

  - id: EPIC-05
    title: Booking System
    system_code: SYS-05
    priority: P0
    capabilities:
      - Booking request creation (hourly, daily, live-in)
      - Booking acceptance/decline by caregiver
      - Booking lifecycle management (requested, accepted, in_progress, completed, cancelled)
      - Cancellation policies and refund rules
      - No-show management
    stories:
      - id: STORY-05-01
        title: Hourly Booking Request Creation
        user_story: "As a care receiver, I want to request hourly care from a caregiver so that I can receive support for specific time periods."
        priority: P0
        compliance_tags: [Safeguarding, Consumer Rights]
        acceptance_criteria:
          - Care receiver selects caregiver and clicks "Request Booking"
          - Care receiver selects booking type (hourly), date, start time, end time (minimum 2 hours)
          - Care receiver specifies care needs (from care needs profile or add notes)
          - Care receiver adds special instructions (e.g., "Please bring own lunch")
          - Care receiver provides emergency contact name and phone number
          - System calculates total cost (hourly rate × hours + platform fee)
          - Care receiver shown total cost before confirming request
          - Booking request created with status "requested" (payment not captured yet)
          - Caregiver notified immediately (email + in-app notification)
          - Audit log records booking request with all details

      - id: STORY-05-02
        title: Booking Request Review by Caregiver
        user_story: "As a caregiver, I want to review booking requests and decide whether to accept so that I only accept bookings I can safely fulfill."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Caregiver receives notification of new booking request
          - Caregiver can view booking details (date, time, care needs, special instructions, care receiver profile)
          - Caregiver can accept or decline booking request within 24 hours
          - Caregiver must provide reason if declining (e.g., "Not qualified for this care need")
          - Accepted bookings trigger payment authorization from care receiver
          - Declined bookings notify care receiver immediately with reason
          - Booking request expires after 24 hours if no response (auto-declined)
          - Audit log records caregiver decision and reason

      - id: STORY-05-03
        title: Booking Acceptance & Payment Authorization
        user_story: "As a care receiver, I want my payment method authorized when caregiver accepts booking so that the caregiver is guaranteed payment."
        priority: P0
        compliance_tags: [Payment Services, Consumer Rights]
        acceptance_criteria:
          - When caregiver accepts booking, care receiver payment method authorized (not captured)
          - Authorization holds total booking amount (caregiver pay + platform fee)
          - Care receiver receives email confirmation of accepted booking with payment authorization
          - Booking status changes to "accepted"
          - Authorization expires if booking cancelled before start time
          - If authorization fails, booking auto-cancelled and caregiver notified
          - Audit log records payment authorization with Stripe transaction ID

      - id: STORY-05-04
        title: Booking In-Progress and Completion
        user_story: "As a caregiver, I want to mark booking as started and completed so that I get paid and care receiver can review."
        priority: P0
        compliance_tags: [Payment Services, Care Act]
        acceptance_criteria:
          - Caregiver can mark booking "in_progress" at start time (via mobile or web)
          - Caregiver can mark booking "completed" at end time (or early if care finished)
          - Caregiver can add completion notes (e.g., "All tasks completed, care receiver in good spirits")
          - When marked "completed", payment captured from care receiver and held in escrow for 48 hours
          - Care receiver receives notification to review booking
          - After 48 hours (or after review), payment released to caregiver
          - Audit log records status changes with timestamps and notes

      - id: STORY-05-05
        title: Booking Cancellation by Care Receiver
        user_story: "As a care receiver, I want to cancel a booking if my plans change so that I'm not charged for care I don't need."
        priority: P0
        compliance_tags: [Consumer Rights, Payment Services]
        acceptance_criteria:
          - Care receiver can cancel booking from booking details page
          - Cancellation more than 24 hours before start time: full refund (no cancellation fee)
          - Cancellation 12-24 hours before start time: 50% cancellation fee (50% refunded)
          - Cancellation less than 12 hours before start time: 100% cancellation fee (no refund)
          - Cancellation policy shown before care receiver confirms cancellation
          - Caregiver notified immediately of cancellation
          - Payment authorization released or partial charge applied per policy
          - Audit log records cancellation time, reason, refund amount

      - id: STORY-05-06
        title: Booking Cancellation by Caregiver
        user_story: "As a caregiver, I want to cancel an accepted booking if I have an emergency so that I don't leave care receiver without notice."
        priority: P0
        compliance_tags: [Safeguarding, Consumer Rights]
        acceptance_criteria:
          - Caregiver can cancel accepted booking from booking details page
          - Caregiver must provide reason for cancellation (emergency, illness, other)
          - Cancellation more than 24 hours before start time: no penalty
          - Cancellation less than 24 hours before start time: caregiver flagged for review (repeated cancellations may result in suspension)
          - Care receiver notified immediately with reason
          - Payment authorization released (care receiver not charged)
          - Platform suggests alternative caregivers to care receiver
          - Audit log records cancellation with reason and late cancellation flag

      - id: STORY-05-07
        title: No-Show Management
        user_story: "As a platform, I want to handle no-show situations so that care receivers are protected and caregivers are held accountable."
        priority: P0
        compliance_tags: [Safeguarding, Consumer Rights]
        acceptance_criteria:
          - If booking not marked "in_progress" within 30 minutes of start time, care receiver can report no-show
          - Care receiver can report caregiver no-show via booking details page
          - No-show report triggers admin review and safeguarding check
          - If no-show confirmed, care receiver receives full refund
          - Caregiver account suspended pending investigation
          - Caregiver can dispute no-show claim (with evidence)
          - Repeated no-shows result in permanent ban
          - Audit log records no-show reports and investigation outcomes

  - id: EPIC-06
    title: Messaging & Communication
    system_code: SYS-06
    priority: P0
    capabilities:
      - In-app messaging between care receivers and caregivers
      - Content filtering to prevent off-platform payments and abuse
      - Message reporting for safeguarding concerns
    stories:
      - id: STORY-06-01
        title: In-App Messaging
        user_story: "As a care receiver, I want to message caregivers before booking so that I can clarify my care needs and assess suitability."
        priority: P0
        compliance_tags: [Safeguarding, GDPR]
        acceptance_criteria:
          - Care receiver can initiate message thread with caregiver from profile page
          - Messages displayed in threaded conversation view (chronological order)
          - Care receiver can send text messages (max 1000 characters)
          - Caregiver receives email notification of new message (with reply link)
          - Caregiver can reply to messages from email or in-app
          - Messages encrypted in transit and at rest (GDPR requirement)
          - Message history persists for audit purposes (7 years retention)
          - Audit log records all messages sent with sender, recipient, timestamp

      - id: STORY-06-02
        title: Content Filtering for Off-Platform Payments
        user_story: "As a platform, I want to detect and block messages containing payment information so that care receivers are protected from off-platform financial exploitation."
        priority: P0
        compliance_tags: [Safeguarding, Payment Services]
        acceptance_criteria:
          - Messages scanned for payment keywords (bank account, PayPal, cash, Venmo, transfer, direct payment)
          - Messages containing payment keywords blocked before sending
          - Sender shown warning message "For your safety, payments must be made through the platform"
          - Blocked messages logged for admin review (potential safeguarding concern)
          - Repeated attempts to share payment info trigger account review
          - Caregiver account suspended if confirmed soliciting off-platform payment
          - Audit log records all blocked messages with keyword matches

      - id: STORY-06-03
        title: Content Filtering for Abuse Keywords
        user_story: "As a platform, I want to detect messages containing abusive or concerning language so that safeguarding team can investigate."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Messages scanned for safeguarding keywords (abuse, hurt, scared, forced, steal, lonely, neglect)
          - Messages containing safeguarding keywords flagged for admin review (message still sent)
          - Flagged messages appear in admin safeguarding queue
          - Admin can review conversation context and escalate to safeguarding team
          - Safeguarding team can contact care receiver to check welfare
          - Audit log records flagged messages with matched keywords

      - id: STORY-06-04
        title: Message Reporting
        user_story: "As a user, I want to report inappropriate messages so that the platform can investigate safeguarding concerns."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - User can report message via "Report" button on message
          - User selects report reason (harassment, inappropriate content, safeguarding concern, spam)
          - User can add notes explaining concern
          - Reported message immediately flagged for admin review
          - Reported user cannot message reporter until admin reviews
          - Admin reviews reported message within 24 hours
          - Admin can warn, suspend, or ban user based on investigation
          - Audit log records all message reports and admin actions

  - id: EPIC-07
    title: Payment System & Escrow
    system_code: SYS-07
    priority: P0
    capabilities:
      - Stripe payment method setup for care receivers
      - Payment authorization and capture flow
      - Platform fee structure
      - Caregiver payout setup (Stripe Connect)
      - Refund processing
      - Dispute resolution and payment holds
    stories:
      - id: STORY-07-01
        title: Care Receiver Payment Method Setup
        user_story: "As a care receiver, I want to add my payment card so that I can pay for care bookings."
        priority: P0
        compliance_tags: [Payment Services, GDPR]
        acceptance_criteria:
          - Care receiver can add payment card via Stripe Elements (PCI-compliant)
          - Card details never stored on platform servers (tokenized by Stripe)
          - Care receiver can save multiple payment methods (default payment method selected)
          - Care receiver can update or delete payment methods
          - Payment method verified via £1 authorization (refunded immediately)
          - Payment method details displayed as "Visa ending in 1234"
          - Audit log records payment method additions and updates (no card details logged)

      - id: STORY-07-02
        title: Payment Authorization on Booking Acceptance
        user_story: "As a care receiver, I want my payment authorized when caregiver accepts booking so that I'm confident the caregiver will be paid."
        priority: P0
        compliance_tags: [Payment Services, Consumer Rights]
        acceptance_criteria:
          - When caregiver accepts booking, Stripe authorization created for total amount (caregiver pay + platform fee)
          - Authorization holds funds on care receiver's card (reduces available credit)
          - Authorization valid for 7 days (Stripe limit)
          - If booking cancelled, authorization released within 24 hours
          - If authorization fails, booking auto-cancelled and both parties notified
          - Care receiver receives email receipt of payment authorization
          - Audit log records authorization with Stripe PaymentIntent ID

      - id: STORY-07-03
        title: Payment Capture on Booking Completion
        user_story: "As a caregiver, I want to be paid when I complete a booking so that I receive compensation for my work."
        priority: P0
        compliance_tags: [Payment Services, Employment Law]
        acceptance_criteria:
          - When caregiver marks booking "completed", payment captured from care receiver
          - Captured funds held in platform escrow account for 48 hours (dispute period)
          - After 48 hours (or after care receiver reviews), funds transferred to caregiver's Stripe Connect account
          - Platform fee deducted from caregiver payout (e.g., 15% fee)
          - Care receiver receives payment receipt via email with breakdown (caregiver pay, platform fee, total)
          - Caregiver receives payout notification via email
          - Audit log records payment capture, escrow hold, and payout transfer with Stripe IDs

      - id: STORY-07-04
        title: Caregiver Payout Setup (Stripe Connect)
        user_story: "As a caregiver, I want to link my bank account so that I can receive payouts from completed bookings."
        priority: P0
        compliance_tags: [Payment Services, AML, HMRC]
        acceptance_criteria:
          - Caregiver can initiate Stripe Connect onboarding from dashboard
          - Stripe collects caregiver identity info, business type (sole trader), bank details
          - Caregiver must provide National Insurance number (HMRC reporting requirement)
          - Stripe verifies bank account via test deposits
          - Caregiver cannot receive payouts until Stripe Connect onboarding complete
          - Caregiver shown onboarding status (pending, verified)
          - Audit log records Stripe Connect account creation and verification status

      - id: STORY-07-05
        title: Refund Processing
        user_story: "As a care receiver, I want to receive refunds when I cancel bookings so that I'm not charged for care I didn't receive."
        priority: P0
        compliance_tags: [Consumer Rights, Payment Services]
        acceptance_criteria:
          - Refunds processed automatically based on cancellation policy (see STORY-05-05)
          - Full refunds process within 5-10 business days (Stripe timeline)
          - Partial refunds calculated based on cancellation fee (e.g., 50% refund)
          - Care receiver receives refund confirmation email with amount and expected date
          - Refund appears on care receiver's original payment method
          - If authorization not yet captured, authorization released immediately (no refund needed)
          - Audit log records all refunds with Stripe Refund ID, amount, reason

      - id: STORY-07-06
        title: Dispute Resolution & Payment Holds
        user_story: "As a platform, I want to hold payments when disputes arise so that we can investigate before releasing funds."
        priority: P0
        compliance_tags: [Safeguarding, Consumer Rights]
        acceptance_criteria:
          - If care receiver reports issue with booking (poor quality, caregiver no-show), payment held beyond 48 hours
          - Admin reviews dispute evidence (messages, booking notes, caregiver response)
          - Admin can release payment to caregiver, refund care receiver, or split payment
          - Both parties notified of dispute decision with reason
          - Disputed payments resolved within 7 days
          - Unresolved disputes escalated to senior admin or legal team
          - Audit log records all disputes with evidence, decision, resolution

  - id: EPIC-08
    title: Reviews, Ratings & Reputation
    system_code: SYS-08
    priority: P0
    capabilities:
      - Post-booking reviews from care receiver to caregiver
      - Rating aggregation and reputation scoring
      - Low rating escalation to admin for quality review
    stories:
      - id: STORY-08-01
        title: Post-Booking Review Creation
        user_story: "As a care receiver, I want to leave a review after a booking so that I can share my experience and help other care receivers."
        priority: P0
        compliance_tags: [Safeguarding, Consumer Rights]
        acceptance_criteria:
          - Care receiver can leave review within 14 days of booking completion
          - Review includes star rating (1-5 stars) for overall experience
          - Review includes optional written comment (max 500 characters)
          - Care receiver can rate specific aspects (punctuality, professionalism, care quality, communication)
          - Review submitted anonymously or with name (care receiver choice)
          - Review published immediately (visible on caregiver profile)
          - Care receiver cannot edit review after submission (prevents manipulation)
          - Audit log records review submission with booking ID and rating

      - id: STORY-08-02
        title: Caregiver Ratings & Reputation Score
        user_story: "As a care receiver, I want to see caregiver ratings so that I can choose caregivers with good track records."
        priority: P0
        compliance_tags: [Transparency, Consumer Rights]
        acceptance_criteria:
          - Caregiver profile displays average star rating (1-5 stars, rounded to 0.5)
          - Profile shows total number of reviews (e.g., "4.8 stars (23 reviews)")
          - Profile shows breakdown of ratings (5 stars: 18, 4 stars: 4, 3 stars: 1, etc.)
          - Recent reviews shown first (most recent 5 reviews on profile page)
          - Care receivers can view all reviews on separate page
          - Ratings updated in real-time when new review submitted
          - Audit log tracks rating calculations for transparency

      - id: STORY-08-03
        title: Low Rating Escalation to Admin
        user_story: "As a platform, I want to review caregivers who receive low ratings so that we can investigate quality concerns."
        priority: P0
        compliance_tags: [Safeguarding, CQC]
        acceptance_criteria:
          - If caregiver receives rating of 2 stars or below, admin automatically notified
          - Admin reviews written comment and booking details
          - Admin can contact care receiver to understand concern
          - Admin can contact caregiver to address quality issue
          - If pattern of low ratings (e.g., 3+ low ratings in 30 days), caregiver account flagged for suspension
          - Admin can require retraining, additional verification, or suspend caregiver
          - Audit log records all low rating escalations and admin actions

  - id: EPIC-09
    title: Safeguarding & Incident Management
    system_code: SYS-09
    priority: P0
    capabilities:
      - Safeguarding reporting system (users can report concerns)
      - Incident management workflow (admin investigation and response)
      - External referral to local authority safeguarding boards
      - User suspension and ban system
      - Safeguarding audit trail
    stories:
      - id: STORY-09-01
        title: Safeguarding Concern Reporting by Users
        user_story: "As a user, I want to report safeguarding concerns so that vulnerable adults are protected."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - User can access "Report Safeguarding Concern" button from any page (header/footer)
          - User selects concern type (abuse, neglect, exploitation, coercion, self-harm risk, other)
          - User provides details of concern (who, what, when, where)
          - User can upload evidence (photos, screenshots, documents)
          - Report submitted anonymously or with contact details (user choice)
          - Admin receives immediate notification of safeguarding report (email + SMS to on-call admin)
          - Report logged in safeguarding incident management system
          - Audit log records report with timestamp, reporter ID (if not anonymous), concern type

      - id: STORY-09-02
        title: Safeguarding Incident Investigation Workflow
        user_story: "As an admin, I want to investigate safeguarding reports so that I can protect vulnerable adults and take appropriate action."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Admin can view all safeguarding reports in dedicated queue
          - Reports categorized by severity (critical, high, medium, low)
          - Critical severity reports flagged for immediate response (within 1 hour)
          - Admin can assign report to safeguarding team member
          - Admin can add investigation notes (visible only to admin team)
          - Admin can request additional information from reporter
          - Admin can contact involved parties (care receiver, caregiver, family member)
          - Admin documents investigation findings and outcome
          - Audit log records all investigation activities with timestamps

      - id: STORY-09-03
        title: External Referral to Safeguarding Adults Board
        user_story: "As an admin, I want to refer serious safeguarding concerns to local authority safeguarding boards so that we fulfill our Care Act duty."
        priority: P0
        compliance_tags: [Care Act, Safeguarding]
        acceptance_criteria:
          - Admin can initiate SAB referral from safeguarding incident page
          - Referral form captures all required information (care receiver details, concern details, actions taken)
          - System identifies appropriate SAB based on care receiver's local authority
          - Admin can send referral via email to SAB designated contact
          - Copy of referral saved in incident record
          - SAB response tracked in incident record
          - Admin can mark referral as "accepted by SAB" or "no further action"
          - Audit log records all SAB referrals with date, SAB contact, outcome

      - id: STORY-09-04
        title: User Suspension & Ban System
        user_story: "As an admin, I want to suspend or ban users who pose safeguarding risks so that vulnerable adults are protected."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Admin can suspend user account from admin dashboard
          - Suspension prevents user login (redirect to "Account Suspended" page)
          - Admin provides reason for suspension (shown to user)
          - Suspended caregivers cannot accept new bookings (existing bookings cancelled)
          - Suspended care receivers cannot create new bookings (existing bookings continue)
          - Admin can set suspension duration (7 days, 30 days, indefinite)
          - Admin can permanently ban user (cannot create new account with same email/phone)
          - Banned users notified via email with reason and appeal process
          - Audit log records all suspensions and bans with reason and duration

      - id: STORY-09-05
        title: Safeguarding Audit Trail
        user_story: "As a platform, I want to maintain comprehensive audit trail of all safeguarding activities so that we can demonstrate Care Act compliance."
        priority: P0
        compliance_tags: [Care Act, CQC, GDPR]
        acceptance_criteria:
          - All safeguarding reports logged with unique incident ID
          - All investigation activities timestamped and attributed to admin user
          - All SAB referrals documented with response tracking
          - All user suspensions and bans logged with reason
          - Audit trail immutable (cannot be deleted or edited)
          - Audit trail exportable for CQC or ICO audit requests
          - Audit trail retained for 7 years (GDPR and Care Act requirement)
          - System generates safeguarding activity reports (monthly, quarterly, annual)

  - id: EPIC-10
    title: Identity & Background Verification
    system_code: SYS-10
    priority: P0
    capabilities:
      - Care receiver identity verification
      - Caregiver enhanced identity verification
      - Right to work verification (UKVI share code)
      - DBS (Disclosure and Barring Service) checks
      - Qualification verification
      - Verification badge system
    stories:
      - id: STORY-10-01
        title: Care Receiver Identity Verification
        user_story: "As a platform, I want to verify care receiver identity so that we prevent fraud and ensure GDPR data subject rights."
        priority: P0
        compliance_tags: [GDPR, Fraud Prevention]
        acceptance_criteria:
          - Care receiver can verify identity by uploading photo ID (passport, driving licence, national ID card)
          - System extracts name and date of birth from ID document (OCR)
          - Admin reviews ID document and confirms name matches account
          - Admin can approve or reject identity verification with reason
          - Verified care receivers shown "Identity Verified" badge on profile
          - Unverified care receivers can still book care but shown trust warning to caregivers
          - Audit log records identity verification attempts and admin decisions

      - id: STORY-10-02
        title: Caregiver Enhanced Identity Verification
        user_story: "As a platform, I want to verify caregiver identity rigorously so that care receivers know who is providing care."
        priority: P0
        compliance_tags: [Safeguarding, DBS, Fraud Prevention]
        acceptance_criteria:
          - Caregiver must verify identity before accepting bookings (mandatory)
          - Caregiver uploads photo ID (passport, driving licence)
          - Caregiver uploads proof of address (utility bill, bank statement, less than 3 months old)
          - Caregiver takes selfie photo (liveness check)
          - Admin compares ID photo to selfie to confirm identity
          - Admin verifies ID document authenticity (holograms, security features)
          - Admin can approve or reject with reason
          - Rejected caregivers cannot resubmit until admin feedback addressed
          - Audit log records all verification attempts with admin decision

      - id: STORY-10-03
        title: Right to Work Verification (UKVI Share Code)
        user_story: "As a platform, I want to verify caregiver right to work in UK so that we comply with immigration law."
        priority: P0
        compliance_tags: [Immigration Act, Right to Work]
        acceptance_criteria:
          - UK/Irish citizens upload photo ID only (automatic right to work)
          - Non-UK/Irish citizens upload photo ID and provide UKVI share code
          - Admin enters share code on gov.uk website to check immigration status
          - Admin verifies visa conditions (work restrictions, hours limits, expiry date)
          - Admin documents visa conditions in caregiver record (e.g., "Student visa: 20 hours/week max")
          - Caregiver with work restrictions cannot accept bookings exceeding limits
          - System tracks caregiver hours to prevent visa violations
          - Admin re-verifies right to work when visa expires
          - Audit log records all right to work checks with gov.uk response details

      - id: STORY-10-04
        title: DBS (Disclosure and Barring Service) Check
        user_story: "As a platform, I want to verify caregiver DBS status so that we prevent individuals with criminal records from accessing vulnerable adults."
        priority: P0
        compliance_tags: [Safeguarding, DBS, Care Act]
        acceptance_criteria:
          - Caregiver uploads DBS certificate (Enhanced DBS for Regulated Activity with Adults)
          - Caregiver provides DBS certificate number and issue date
          - Admin verifies DBS certificate authenticity (check watermark, format)
          - Admin confirms DBS is Enhanced level (not Basic or Standard)
          - Admin confirms DBS includes "Adults' Barred List" check
          - Admin confirms DBS issued within last 12 months (or caregiver enrolled in Update Service)
          - If DBS shows criminal record, admin reviews offence details and risk assessment
          - Admin can approve, reject, or request additional information
          - Caregivers with relevant convictions (violence, abuse, theft) automatically rejected
          - DBS status shown on caregiver profile ("Enhanced DBS Verified")
          - Audit log records DBS verification with certificate number and admin decision

      - id: STORY-10-05
        title: Qualification Verification (Admin Review)
        user_story: "As an admin, I want to verify caregiver qualifications so that care receivers can trust caregiver credentials."
        priority: P0
        compliance_tags: [Safeguarding, CQC]
        acceptance_criteria:
          - Admin can view uploaded qualification certificates in verification queue
          - Admin verifies certificate details (issuing body, qualification name, date obtained, expiry date)
          - Admin checks qualification is from recognized awarding body (e.g., City & Guilds, Pearson)
          - Admin can search awarding body website to confirm certificate validity
          - Admin can approve, reject, or request clearer photo
          - Admin documents verification notes (visible only to admin)
          - Verified qualifications shown with "Verified" badge on caregiver profile
          - Expired qualifications flagged automatically and badges removed
          - Audit log records all qualification verification decisions

      - id: STORY-10-06
        title: Verification Badge System
        user_story: "As a care receiver, I want to see verification badges on caregiver profiles so that I can trust caregiver credentials."
        priority: P0
        compliance_tags: [Transparency, Consumer Rights]
        acceptance_criteria:
          - Caregiver profile displays badges for each verification type (Identity, DBS, Right to Work, Qualifications)
          - Badges color-coded (green = verified, orange = pending, red = not verified)
          - Care receiver can click badge to see verification details (e.g., "DBS verified on 15 Jan 2026")
          - Unverified caregivers cannot be booked (booking button disabled with message)
          - Verification badges update in real-time when admin approves verification
          - Expired verifications (e.g., DBS older than 12 months) show "Expired" status
          - Audit log tracks verification badge visibility for transparency

  - id: EPIC-11
    title: Clinical Safety Monitoring
    system_code: SYS-11
    priority: P0
    capabilities:
      - Falls and injury reporting
      - Emergency situation handling during bookings
      - Medical emergency protocol
      - Clinical incident audit trail
    stories:
      - id: STORY-11-01
        title: Falls & Injury Reporting by Caregiver
        user_story: "As a caregiver, I want to report falls or injuries during bookings so that care receiver receives appropriate follow-up and incidents are documented."
        priority: P0
        compliance_tags: [Safeguarding, CQC, Care Act]
        acceptance_criteria:
          - Caregiver can report incident from active booking page
          - Incident type selection (fall, injury, medical emergency, medication error, behavioural concern, other)
          - Caregiver provides incident details (what happened, when, where, witness present)
          - Caregiver specifies actions taken (called 999, administered first aid, notified family, other)
          - Caregiver can upload photos of injury or scene (optional)
          - Incident report immediately flagged to admin (email + SMS notification)
          - Family members notified automatically of incident
          - Admin reviews incident within 24 hours and documents follow-up actions
          - Audit log records all incident reports with timestamp and details

      - id: STORY-11-02
        title: Emergency Button During Active Booking
        user_story: "As a caregiver, I want to access emergency help button during booking so that I can get immediate support if care receiver has medical emergency."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety]
        acceptance_criteria:
          - Active booking page shows prominent "Emergency" button
          - Button triggers immediate notifications (admin on-call phone, family emergency contact)
          - Caregiver shown emergency instructions (call 999, provide first aid, stay with care receiver)
          - Admin can call caregiver directly from emergency notification
          - Emergency event logged with timestamp and location
          - Post-emergency, admin contacts caregiver to document what happened
          - Emergency button usage tracked for quality monitoring
          - Audit log records all emergency button activations with response times

      - id: STORY-11-03
        title: Medical Emergency Protocol
        user_story: "As a platform, I want to provide clear medical emergency protocol so that caregivers respond appropriately to life-threatening situations."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety, CQC]
        acceptance_criteria:
          - Emergency button displays step-by-step protocol (1. Call 999, 2. Notify family, 3. Administer first aid if trained, 4. Stay with care receiver)
          - Protocol includes specific guidance for common emergencies (choking, seizure, fall with head injury, chest pain)
          - Caregiver can access emergency contact numbers (999, family emergency contact, admin on-call)
          - After emergency, caregiver completes incident report documenting actions taken
          - Admin reviews emergency response and provides feedback to caregiver
          - Caregivers without First Aid qualification shown additional warning to call 999 immediately
          - Audit log records emergency protocol views and actions taken

      - id: STORY-11-04
        title: Clinical Incident Audit Trail
        user_story: "As a platform, I want to maintain audit trail of all clinical incidents so that we can demonstrate CQC compliance and identify safety patterns."
        priority: P0
        compliance_tags: [CQC, Care Act, Safeguarding]
        acceptance_criteria:
          - All incident reports logged with unique incident ID
          - Incident details immutable (cannot be edited after submission)
          - Admin can add follow-up notes to incident record
          - Incidents categorized by severity (minor, moderate, serious, critical)
          - Serious incidents (hospitalization, death) automatically escalated to senior admin
          - Platform generates incident reports (monthly, quarterly) for CQC readiness
          - Incident data analyzed for patterns (e.g., frequent falls with specific caregiver)
          - Audit trail retained for 7 years (CQC requirement)

  - id: EPIC-12
    title: Admin Operations & Oversight
    system_code: SYS-12
    priority: P0
    capabilities:
      - Admin dashboard for platform oversight
      - User management (search, view, edit, suspend users)
      - Caregiver application review workflow
      - Verification management (approve/reject verifications)
      - Booking oversight and dispute resolution
      - Report management (safeguarding, incident, quality reports)
      - Admin audit log
    stories:
      - id: STORY-12-01
        title: Admin Dashboard Overview
        user_story: "As an admin, I want to view platform health metrics so that I can monitor operations and identify issues."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Dashboard displays key metrics (total users, active caregivers, bookings today, revenue today)
          - Dashboard shows pending tasks (verification queue, safeguarding reports, disputes)
          - Dashboard highlights urgent items (critical safeguarding reports, expired verifications)
          - Dashboard shows recent activity feed (new registrations, bookings, reviews)
          - Admin can filter metrics by date range
          - Dashboard refreshes automatically every 5 minutes
          - Dashboard accessible only to admin users (RBAC enforcement)

      - id: STORY-12-02
        title: User Search & Management
        user_story: "As an admin, I want to search and view user accounts so that I can investigate issues and manage users."
        priority: P0
        compliance_tags: [GDPR, Safeguarding]
        acceptance_criteria:
          - Admin can search users by name, email, phone number, user ID
          - Search results show user type (care receiver, caregiver, family member), status (active, suspended, banned)
          - Admin can view full user profile (personal details, verification status, bookings, reviews, messages, payments)
          - Admin can edit user details (name, email, phone) if user requests correction
          - Admin can view user activity history (login history, bookings, messages sent)
          - Admin can suspend or ban user (see STORY-09-04)
          - All admin actions on user account logged in audit trail
          - GDPR: Admin access to user data logged for data protection audit

      - id: STORY-12-03
        title: Caregiver Application Review Workflow
        user_story: "As an admin, I want to review caregiver applications so that only qualified caregivers can offer services."
        priority: P0
        compliance_tags: [Safeguarding, DBS, Care Act]
        acceptance_criteria:
          - Admin can view pending caregiver applications in queue
          - Application includes caregiver profile, uploaded documents (ID, DBS, qualifications, proof of address)
          - Admin can review each document (zoom, download for closer inspection)
          - Admin can approve or reject application with reason
          - Rejected applications trigger email to caregiver with feedback and resubmission instructions
          - Approved applications activate caregiver account (can accept bookings)
          - Admin can request additional information before approving
          - Audit log records all application review decisions with admin ID and timestamp

      - id: STORY-12-04
        title: Verification Queue Management
        user_story: "As an admin, I want to manage verification queue so that verifications are processed efficiently."
        priority: P0
        compliance_tags: [Safeguarding, DBS, Right to Work]
        acceptance_criteria:
          - Verification queue displays pending verifications (identity, DBS, qualifications, right to work)
          - Queue sorted by submission date (oldest first)
          - Queue shows verification type and caregiver name
          - Admin can filter queue by verification type
          - Admin can assign verifications to team members
          - Admin can mark verification as "in progress" to prevent duplicate reviews
          - Admin can approve or reject verification with reason
          - Queue shows average processing time (SLA: 48 hours)

      - id: STORY-12-05
        title: Booking Oversight & Dispute Resolution
        user_story: "As an admin, I want to view and manage bookings so that I can resolve disputes and ensure quality."
        priority: P0
        compliance_tags: [Consumer Rights, Safeguarding]
        acceptance_criteria:
          - Admin can search bookings by booking ID, care receiver name, caregiver name, date
          - Admin can view full booking details (care needs, messages, payment status, reviews)
          - Admin can view disputed bookings in dedicated queue
          - Admin can communicate with care receiver and caregiver to investigate dispute
          - Admin can issue refunds, release payments, or split payments based on investigation
          - Admin can cancel bookings if safeguarding concern identified
          - Admin actions on bookings logged in audit trail
          - Disputed bookings resolved within 7 days (SLA)

      - id: STORY-12-06
        title: Safeguarding Report Management
        user_story: "As an admin, I want to manage safeguarding reports so that I can investigate concerns and protect vulnerable adults."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Admin can view all safeguarding reports in dedicated queue (see STORY-09-02)
          - Reports categorized by severity (critical, high, medium, low)
          - Critical reports highlighted and assigned to safeguarding lead
          - Admin can assign reports to team members
          - Admin can add investigation notes and document actions taken
          - Admin can escalate reports to external authorities (SAB, police)
          - Admin can close reports with resolution notes
          - Safeguarding reports retained indefinitely (Care Act requirement)

      - id: STORY-12-07
        title: Admin Audit Log
        user_story: "As a platform, I want to log all admin actions so that we can demonstrate accountability and investigate admin misconduct."
        priority: P0
        compliance_tags: [GDPR, CQC, Accountability]
        acceptance_criteria:
          - All admin actions logged with admin user ID, action type, timestamp, IP address
          - Logged actions include user suspensions, verification decisions, payment refunds, data access
          - Audit log immutable (cannot be edited or deleted by admin)
          - Audit log searchable by admin user, action type, date range
          - Audit log exportable for compliance audits
          - GDPR: Admin access to user data logged for data protection compliance
          - Audit log retained for 7 years

  - id: EPIC-13
    title: Compliance & Audit System
    system_code: SYS-13
    priority: P0
    capabilities:
      - Comprehensive audit trail for all platform actions
      - GDPR compliance (consent, data subject rights, DPIA)
      - Data retention policies
      - Care Act 2014 compliance
      - Payment Services Regulations compliance
      - Consumer Rights Act compliance
      - Equality Act compliance
      - Terms of Service and legal agreements
    stories:
      - id: STORY-13-01
        title: Comprehensive Audit Trail
        user_story: "As a platform, I want to log all user and admin actions so that we can investigate incidents and demonstrate regulatory compliance."
        priority: P0
        compliance_tags: [GDPR, CQC, Care Act, Accountability]
        acceptance_criteria:
          - All user actions logged (registration, login, booking creation, message sending, review submission)
          - All admin actions logged (verification decisions, user suspensions, payment refunds, data access)
          - Each log entry includes timestamp (UTC), user/admin ID, action type, IP address, user agent
          - High-risk actions include additional context (e.g., suspension reason, refund amount)
          - Audit logs immutable (write-only database)
          - Audit logs encrypted at rest (GDPR requirement)
          - Audit logs retained for 7 years (CQC and Care Act requirement)
          - Audit logs searchable by date range, user ID, action type

      - id: STORY-13-02
        title: GDPR Consent Management
        user_story: "As a platform, I want to capture and manage user consent so that we comply with GDPR."
        priority: P0
        compliance_tags: [GDPR]
        acceptance_criteria:
          - Users must accept Terms of Service and Privacy Policy during registration
          - Consent includes checkboxes for data processing purposes (account management, booking processing, marketing communications)
          - Users can withdraw consent for marketing communications (unsubscribe link in emails)
          - Users cannot withdraw consent for essential processing (account management, legal obligations)
          - Consent records stored with timestamp and version of Terms/Privacy Policy accepted
          - Users can view consent history in account settings
          - Audit log records all consent changes

      - id: STORY-13-03
        title: GDPR Data Subject Rights Interface
        user_story: "As a user, I want to exercise my GDPR rights (access, rectification, erasure, portability) so that I control my personal data."
        priority: P0
        compliance_tags: [GDPR]
        acceptance_criteria:
          - Users can request data export (download all personal data in JSON format)
          - Data export includes profile, bookings, messages, payments, reviews, audit logs
          - Data export delivered within 30 days (GDPR requirement)
          - Users can request account deletion (right to erasure)
          - Account deletion anonymizes user data (replaces name with "Deleted User", deletes contact info)
          - Reviews and bookings retained for platform integrity (with anonymized user)
          - Users can request data correction (email admin with correction request)
          - Admin processes data subject requests within 30 days (GDPR SLA)

      - id: STORY-13-04
        title: Data Retention Policy Enforcement
        user_story: "As a platform, I want to enforce data retention policies so that we comply with GDPR and regulatory requirements."
        priority: P0
        compliance_tags: [GDPR, HMRC, Care Act]
        acceptance_criteria:
          - User account data retained for 7 years after last activity (Care Act and HMRC requirement)
          - Payment data retained for 7 years (HMRC tax audit requirement)
          - Safeguarding records retained indefinitely (Care Act requirement)
          - Audit logs retained for 7 years
          - Messages encrypted and retained for 7 years (safeguarding evidence)
          - After retention period, data automatically deleted (scheduled job runs monthly)
          - Data deletion logged in audit trail
          - Users can request early deletion (right to erasure) unless legal obligation requires retention

      - id: STORY-13-05
        title: Care Act 2014 Safeguarding Compliance
        user_story: "As a platform, I want to demonstrate Care Act compliance so that we fulfill our legal safeguarding duties."
        priority: P0
        compliance_tags: [Care Act, Safeguarding]
        acceptance_criteria:
          - Platform documents safeguarding policy (prevention, detection, response to abuse/neglect)
          - Platform maintains safeguarding reporting system (see EPIC-09)
          - Platform collaborates with Safeguarding Adults Boards (SAB liaison procedures)
          - Platform trains staff on safeguarding responsibilities
          - Platform maintains audit trail of safeguarding incidents and actions taken
          - Platform conducts annual safeguarding audits
          - Platform generates safeguarding reports for regulatory review
          - Safeguarding policy published on website (accessible to users and regulators)

      - id: STORY-13-06
        title: Payment Services Regulations Compliance
        user_story: "As a platform, I want to comply with Payment Services Regulations so that we legally process payments."
        priority: P0
        compliance_tags: [Payment Services, AML]
        acceptance_criteria:
          - Platform uses authorized payment service provider (Stripe, FCA-authorized)
          - Payment processing delegated to Stripe (platform does not store card details)
          - Platform maintains records of all payment transactions for 7 years (AML requirement)
          - Platform monitors for suspicious payment activity (e.g., large cash-out requests)
          - Platform reports suspicious activity to National Crime Agency (NCA) if AML thresholds met
          - Platform maintains payment transaction audit trail (Stripe transaction IDs, amounts, dates)
          - Platform generates payment reports for HMRC (annual revenue reporting)

      - id: STORY-13-07
        title: Consumer Rights Act Compliance
        user_story: "As a platform, I want to comply with Consumer Rights Act so that care receivers have clear rights and protections."
        priority: P0
        compliance_tags: [Consumer Rights]
        acceptance_criteria:
          - Terms of Service clearly state service descriptions, pricing, cancellation policies
          - Cancellation policy complies with 14-day cooling-off period (where applicable)
          - Care receivers can cancel bookings per published cancellation policy
          - Platform provides clear booking confirmations (email receipts)
          - Platform provides clear refund process
          - Platform handles complaints fairly (admin dispute resolution)
          - Platform displays Terms of Service prominently (footer link, registration acceptance)
          - Terms of Service reviewed annually by legal team

      - id: STORY-13-08
        title: Equality Act 2010 Compliance
        user_story: "As a platform, I want to comply with Equality Act so that we do not discriminate against users with protected characteristics."
        priority: P0
        compliance_tags: [Equality Act, Accessibility]
        acceptance_criteria:
          - Platform does not discriminate based on age, disability, gender, race, religion, sexual orientation
          - Gender preference filtering only permitted for legitimate care reasons (see GD-10)
          - Platform accessible to users with disabilities (WCAG 2.1 AA compliance)
          - Platform provides reasonable adjustments (e.g., family member accounts for cognitively impaired users)
          - Platform does not use discriminatory language in policies or communications
          - Platform trains staff on Equality Act responsibilities
          - Platform monitors for discriminatory behavior by users (messages, reviews)
          - Platform enforces non-discrimination policy (suspensions for discriminatory behavior)

      - id: STORY-13-09
        title: Terms of Service & Privacy Policy
        user_story: "As a user, I want to understand my rights and platform policies so that I can make informed decisions."
        priority: P0
        compliance_tags: [GDPR, Consumer Rights, Transparency]
        acceptance_criteria:
          - Terms of Service clearly explain user rights, platform responsibilities, cancellation policies, dispute resolution
          - Privacy Policy clearly explains data collection, processing, sharing, retention, user rights
          - Both documents written in plain English (not legalese)
          - Both documents accessible from all pages (footer links)
          - Users must accept both during registration
          - Platform emails users when Terms or Privacy Policy updated (30 days notice)
          - Users can view historical versions of Terms and Privacy Policy
          - Platform maintains version control for all legal documents

  - id: EPIC-14
    title: Emergency Escalation & Response
    system_code: SYS-14
    priority: P0
    capabilities:
      - Emergency contact system
      - Emergency button for caregivers during bookings
      - Emergency services coordination (999)
      - Emergency escalation matrix
      - Emergency preparedness training for caregivers
    stories:
      - id: STORY-14-01
        title: Emergency Contact Registration
        user_story: "As a care receiver, I want to register emergency contact details so that my family is notified if I have a medical emergency during care."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety]
        acceptance_criteria:
          - Care receiver can add emergency contacts (name, relationship, phone number)
          - Care receiver can add multiple emergency contacts (primary, secondary)
          - Emergency contacts notified automatically if caregiver reports emergency
          - Emergency contacts shown to caregiver during booking
          - Care receiver can update emergency contacts anytime
          - Emergency contacts verified (SMS code sent to confirm phone number)
          - Audit log records emergency contact changes

      - id: STORY-14-02
        title: Emergency Button During Booking (Caregiver)
        user_story: "As a caregiver, I want to access emergency help during booking so that I can get immediate support if care receiver has medical crisis."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety]
        acceptance_criteria:
          - Active booking page shows prominent "Emergency" button (red, always visible)
          - Button triggers immediate notifications (admin on-call phone, family emergency contacts via SMS)
          - Notification includes booking details, care receiver address, caregiver phone
          - Caregiver shown emergency protocol (call 999, administer first aid if trained, stay with care receiver)
          - Admin on-call can call caregiver directly from emergency notification
          - Emergency button usage logged with timestamp and location
          - Post-emergency, admin contacts caregiver to complete incident report
          - Audit log records emergency button activations and response times

      - id: STORY-14-03
        title: Emergency Services Coordination (999)
        user_story: "As a platform, I want to provide clear guidance for calling 999 so that caregivers respond appropriately to life-threatening emergencies."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety]
        acceptance_criteria:
          - Emergency protocol clearly states when to call 999 (unconscious, chest pain, severe bleeding, seizure, choking, fall with head injury)
          - Caregiver shown care receiver address and postcode (for 999 call)
          - Caregiver shown care receiver medical conditions (relevant for 999 call)
          - After 999 call, caregiver completes incident report documenting emergency
          - Admin reviews emergency response and provides feedback
          - Platform maintains list of when 999 appropriate vs. NHS 111
          - Audit log records 999 calls made during bookings

      - id: STORY-14-04
        title: Emergency Escalation Matrix
        user_story: "As an admin, I want clear escalation procedures so that I respond appropriately to emergency notifications."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety]
        acceptance_criteria:
          - Emergency notifications categorized by severity (critical, high, medium)
          - Critical emergencies (caregiver pressed emergency button) trigger immediate response (admin calls caregiver within 5 minutes)
          - High emergencies (incident report with 999 call) trigger response within 1 hour
          - Medium emergencies (non-urgent incident reports) trigger response within 24 hours
          - Admin on-call schedule ensures 24/7 coverage
          - Admin can escalate to senior management or safeguarding lead if needed
          - Emergency response times tracked and reported monthly
          - Audit log records all emergency escalations and response times

      - id: STORY-14-05
        title: Emergency Preparedness Training (Caregivers)
        user_story: "As a caregiver, I want training on emergency procedures so that I can respond confidently to emergencies."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety, CQC]
        acceptance_criteria:
          - Caregiver onboarding includes emergency preparedness training module
          - Training covers when to call 999, how to use emergency button, basic first aid, safeguarding reporting
          - Caregiver must pass quiz to complete training (80% pass mark)
          - Caregiver receives certificate of completion
          - Training refreshed annually
          - Caregivers without First Aid qualification shown additional warnings to call 999 immediately
          - Training completion tracked in caregiver record
          - Audit log records training completion and quiz scores

  - id: EPIC-15
    title: Calendar & Availability Management
    system_code: SYS-15
    priority: P0
    capabilities:
      - Caregiver availability configuration (set working hours, block dates)
      - Real-time availability sync (prevent double-booking)
      - Care receiver calendar view (view upcoming bookings)
      - Caregiver calendar view (manage availability and bookings)
    stories:
      - id: STORY-15-01
        title: Caregiver Availability Configuration
        user_story: "As a caregiver, I want to set my availability so that I only receive booking requests when I'm available."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Caregiver can set recurring weekly availability (e.g., "Monday 9am-5pm, Tuesday 9am-5pm")
          - Caregiver can set specific dates as unavailable (e.g., "Block Dec 25-26 for holiday")
          - Caregiver can set specific dates as available (override recurring schedule)
          - Caregiver can set maximum travel radius (5, 10, 15, 20 miles)
          - Availability changes reflected in search results immediately
          - Caregivers with no availability set cannot appear in search results
          - Audit log records availability changes

      - id: STORY-15-02
        title: Real-Time Availability Sync (Double-Booking Prevention)
        user_story: "As a platform, I want to prevent double-booking so that caregivers are not overcommitted."
        priority: P0
        compliance_tags: [Consumer Rights, Safeguarding]
        acceptance_criteria:
          - When booking accepted, caregiver availability automatically blocked for that time slot
          - Care receivers cannot request bookings during blocked time slots
          - If caregiver cancels booking, availability automatically unblocked
          - Search results show only caregivers available for requested date/time
          - Booking requests outside caregiver availability rejected with error message
          - Double-booking prevented even if two care receivers request same time slot simultaneously (database lock)
          - Audit log records availability blocks and unblocks

      - id: STORY-15-03
        title: Care Receiver Calendar View
        user_story: "As a care receiver, I want to view my upcoming bookings on a calendar so that I can manage my care schedule."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Calendar displays upcoming bookings (next 30 days)
          - Each booking shows caregiver name, date, time, status (requested, accepted, in_progress, completed)
          - Care receiver can click booking to view details or cancel
          - Calendar shows color coding (requested = yellow, accepted = green, completed = grey)
          - Calendar view switchable (month view, week view, list view)
          - Care receiver can filter by status or caregiver
          - Calendar exports to iCal (for Google Calendar, Apple Calendar)

      - id: STORY-15-04
        title: Caregiver Calendar View
        user_story: "As a caregiver, I want to view my bookings and availability on a calendar so that I can manage my work schedule."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Calendar displays accepted bookings (next 30 days)
          - Calendar shows availability blocks (green = available, red = unavailable)
          - Caregiver can click booking to view details or cancel
          - Caregiver can adjust availability directly from calendar (drag to block dates)
          - Calendar shows booking status (requested, accepted, in_progress, completed)
          - Calendar exports to iCal
          - Caregiver can view earnings forecast based on upcoming bookings

  - id: EPIC-16
    title: Family & Multi-User Accounts
    system_code: SYS-16
    priority: P0
    capabilities:
      - Family account structure (link family member to care receiver)
      - Family member invitation system
      - Role-based permissions for family members (view bookings, create bookings, manage payments)
    stories:
      - id: STORY-16-01
        title: Family Member Invitation
        user_story: "As a care receiver, I want to invite my family member to help manage my care so that they can book caregivers on my behalf."
        priority: P0
        compliance_tags: [Safeguarding, Mental Capacity Act, GDPR]
        acceptance_criteria:
          - Care receiver can invite family member via email
          - Invitation includes link to register or login (if already registered)
          - Family member accepts invitation by clicking link
          - Care receiver specifies family member permissions (view bookings, create bookings, manage payments, full access)
          - Care receiver can revoke family member access anytime
          - Family member cannot invite additional family members (only care receiver can)
          - Audit log records family account linkages and permission changes

      - id: STORY-16-02
        title: Family Member Permissions
        user_story: "As a care receiver, I want to control what my family member can do on my behalf so that I maintain autonomy."
        priority: P0
        compliance_tags: [Mental Capacity Act, Safeguarding]
        acceptance_criteria:
          - Care receiver can grant "view only" permission (family member can view bookings but not create or cancel)
          - Care receiver can grant "booking" permission (family member can create and cancel bookings)
          - Care receiver can grant "payment" permission (family member can add/update payment methods)
          - Care receiver can grant "full access" permission (all permissions)
          - Family member shown clear indication of acting on behalf of care receiver (e.g., "Booking for [Care Receiver Name]")
          - Family member cannot change care receiver's care needs profile without "full access" permission
          - Audit log records all family member actions on behalf of care receiver

      - id: STORY-16-03
        title: Family Account Safeguarding
        user_story: "As a platform, I want to monitor family accounts for coercion so that vulnerable adults are not exploited by family members."
        priority: P0
        compliance_tags: [Safeguarding, Mental Capacity Act]
        acceptance_criteria:
          - If care receiver reports safeguarding concern about family member, admin can revoke family member access
          - Admin can review family account activity (bookings created by family member, payments made)
          - Admin can contact care receiver separately to confirm consent for family member access
          - If care receiver lacks mental capacity (documented), family member must upload Lasting Power of Attorney (LPA) certificate
          - Family members without LPA cannot create bookings on behalf of cognitively impaired care receiver
          - Audit log records family account safeguarding reviews

  - id: EPIC-17
    title: Caregiver Dashboard & Management
    system_code: SYS-17
    priority: P0
    capabilities:
      - Dashboard overview (bookings, earnings, messages)
      - Booking request management
      - Upcoming bookings management
      - Earnings dashboard
      - Calendar management
      - Profile management
      - Message center
    stories:
      - id: STORY-17-01
        title: Caregiver Dashboard Overview
        user_story: "As a caregiver, I want to see my dashboard overview so that I can quickly understand my upcoming work and earnings."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Dashboard shows today's bookings (date, time, care receiver name, address)
          - Dashboard shows pending booking requests (count with link to review)
          - Dashboard shows this week's earnings (total estimated payout)
          - Dashboard shows unread messages count
          - Dashboard shows verification status (DBS, identity, qualifications)
          - Dashboard shows profile completion percentage (encourage full profile)
          - Dashboard shows quick actions (set availability, view calendar, update profile)

      - id: STORY-17-02
        title: Booking Request Management
        user_story: "As a caregiver, I want to review and respond to booking requests so that I can accept bookings I'm qualified for."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Caregiver can view all pending booking requests (sorted by date requested)
          - Each request shows care receiver name, date/time, care needs, special instructions
          - Caregiver can view care receiver profile (medical conditions, reviews given to other caregivers)
          - Caregiver can accept or decline request with reason
          - Accepted requests trigger payment authorization and move to "Upcoming Bookings"
          - Declined requests notify care receiver with reason
          - Requests expire after 24 hours if no response

      - id: STORY-17-03
        title: Upcoming Bookings Management
        user_story: "As a caregiver, I want to view and manage my upcoming bookings so that I can prepare for care visits."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Caregiver can view all accepted bookings (sorted by date)
          - Each booking shows care receiver name, address, date/time, care needs, emergency contact
          - Caregiver can view directions to care receiver address (Google Maps link)
          - Caregiver can message care receiver to confirm details
          - Caregiver can cancel booking if necessary (see STORY-05-06)
          - Caregiver can mark booking "in_progress" and "completed"
          - Caregiver can report incidents during booking (see STORY-11-01)

      - id: STORY-17-04
        title: Earnings Dashboard
        user_story: "As a caregiver, I want to view my earnings and payout history so that I can track my income."
        priority: P0
        compliance_tags: [Employment Law, HMRC]
        acceptance_criteria:
          - Dashboard shows total earnings (this week, this month, all time)
          - Dashboard shows pending payouts (completed bookings in 48-hour escrow period)
          - Dashboard shows payout history (date, amount, status: paid, pending, failed)
          - Dashboard shows breakdown of each payout (booking ID, care receiver, hours worked, rate, platform fee, net payout)
          - Caregiver can download payout statements (PDF) for tax purposes
          - Dashboard shows estimated next payout date
          - Dashboard links to Stripe Connect dashboard for bank account management

      - id: STORY-17-05
        title: Profile Management
        user_story: "As a caregiver, I want to update my profile so that care receivers see accurate information about my experience."
        priority: P0
        compliance_tags: [Transparency, Safeguarding]
        acceptance_criteria:
          - Caregiver can update bio (max 500 characters)
          - Caregiver can upload profile photo (JPEG, PNG, max 5MB)
          - Caregiver can update hourly rate (minimum £12/hour, platform minimum wage)
          - Caregiver can update medical condition experience (see STORY-02-01)
          - Caregiver can update care skills (see STORY-02-02)
          - Caregiver can upload qualifications (see STORY-02-03)
          - Profile changes trigger admin verification if high-risk (e.g., adding personal care skill)
          - Audit log records profile changes

      - id: STORY-17-06
        title: Message Center (Caregiver)
        user_story: "As a caregiver, I want to view and respond to messages from care receivers so that I can communicate about bookings."
        priority: P0
        compliance_tags: [Safeguarding, GDPR]
        acceptance_criteria:
          - Caregiver can view all message threads (sorted by most recent)
          - Unread messages highlighted
          - Caregiver can search messages by care receiver name or keyword
          - Caregiver can send text messages (max 1000 characters)
          - Messages filtered for off-platform payment keywords (see STORY-06-02)
          - Caregiver can report inappropriate messages (see STORY-06-04)
          - Caregiver receives email notifications of new messages

  - id: EPIC-18
    title: Care Receiver Dashboard
    system_code: SYS-18
    priority: P0
    capabilities:
      - Dashboard overview (upcoming bookings, messages, recommendations)
      - Care needs profile management
      - Caregiver search and discovery
      - Booking management
      - Message center
      - Payment and transaction history
    stories:
      - id: STORY-18-01
        title: Care Receiver Dashboard Overview
        user_story: "As a care receiver, I want to see my dashboard overview so that I can quickly access my upcoming bookings and messages."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Dashboard shows upcoming bookings (next 7 days)
          - Dashboard shows pending booking requests (waiting for caregiver response)
          - Dashboard shows unread messages count
          - Dashboard shows quick actions (search caregivers, view calendar, update care needs)
          - Dashboard shows recent caregivers (for rebooking)
          - Dashboard shows safety tips (e.g., "Never pay caregivers off-platform")

      - id: STORY-18-02
        title: Care Needs Profile Management
        user_story: "As a care receiver, I want to update my care needs profile so that I'm matched with appropriate caregivers."
        priority: P0
        compliance_tags: [Safeguarding, GDPR]
        acceptance_criteria:
          - Care receiver can update medical conditions (see STORY-03-01)
          - Care receiver can update required care skills
          - Care receiver can update mobility status (mobile, uses walker, wheelchair user, bedbound)
          - Care receiver can add notes about care preferences (e.g., "I have a cat, please be comfortable with pets")
          - Care needs profile saved securely (encrypted health data)
          - Profile updates reflected in caregiver search results immediately
          - Audit log records care needs changes

      - id: STORY-18-03
        title: Caregiver Search & Discovery
        user_story: "As a care receiver, I want to search for caregivers so that I can find someone suitable for my needs."
        priority: P0
        compliance_tags: [Safeguarding]
        acceptance_criteria:
          - Care receiver can search by location (postcode, radius)
          - Care receiver can filter by medical condition experience, care skills, DBS status, availability, gender
          - Search results show caregiver profiles with ratings, hourly rate, distance, verification badges
          - Care receiver can view full caregiver profile
          - Care receiver can save favorite caregivers for future bookings
          - Search results exclude unverified caregivers
          - Audit log tracks searches for product analytics

      - id: STORY-18-04
        title: Booking Management
        user_story: "As a care receiver, I want to view and manage my bookings so that I can track my care schedule."
        priority: P0
        compliance_tags: [Consumer Rights]
        acceptance_criteria:
          - Care receiver can view all bookings (upcoming, completed, cancelled)
          - Care receiver can filter bookings by status or caregiver
          - Care receiver can view booking details (caregiver, date/time, cost, status)
          - Care receiver can cancel booking (see STORY-05-05)
          - Care receiver can message caregiver about booking
          - Care receiver can leave review after booking completed (see STORY-08-01)
          - Care receiver can report incident or safeguarding concern
          - Audit log records booking views and actions

      - id: STORY-18-05
        title: Message Center (Care Receiver)
        user_story: "As a care receiver, I want to view and send messages to caregivers so that I can discuss my care needs."
        priority: P0
        compliance_tags: [Safeguarding, GDPR]
        acceptance_criteria:
          - Care receiver can view all message threads
          - Care receiver can search messages by caregiver name or keyword
          - Care receiver can send text messages (max 1000 characters)
          - Messages filtered for safeguarding keywords (see STORY-06-03)
          - Care receiver can report inappropriate messages (see STORY-06-04)
          - Care receiver receives email notifications of new messages
          - Family members (with permission) can view messages

      - id: STORY-18-06
        title: Payment & Transaction History
        user_story: "As a care receiver, I want to view my payment history so that I can track my care expenses."
        priority: P0
        compliance_tags: [Consumer Rights, HMRC]
        acceptance_criteria:
          - Care receiver can view all transactions (bookings paid, refunds received)
          - Each transaction shows date, caregiver, booking details, amount paid, platform fee, total
          - Care receiver can download transaction statements (PDF) for records
          - Care receiver can view saved payment methods and update/delete
          - Care receiver can view refund history
          - Transaction history exportable to CSV for expense tracking
          - Audit log records transaction history views

  - id: EPIC-19
    title: Notifications & Alerts
    system_code: SYS-19
    priority: P0
    capabilities:
      - Transactional email notifications (booking confirmations, payment receipts)
      - In-app notifications (real-time booking requests, messages)
    stories:
      - id: STORY-19-01
        title: Transactional Email Notifications
        user_story: "As a user, I want to receive email notifications for important events so that I stay informed about bookings and payments."
        priority: P0
        compliance_tags: [Consumer Rights, Distance Selling]
        acceptance_criteria:
          - Care receiver receives email when booking request sent (confirmation with details)
          - Care receiver receives email when caregiver accepts booking (confirmation with payment authorization)
          - Care receiver receives email when booking completed (receipt with payment breakdown)
          - Care receiver receives email when refund processed (refund amount and expected date)
          - Caregiver receives email when booking request received (link to review request)
          - Caregiver receives email when booking cancelled by care receiver
          - Caregiver receives email when payout processed (payout amount and date)
          - All emails include clear subject line, platform branding, unsubscribe link (for non-essential emails)
          - Audit log records all emails sent with timestamp and recipient

      - id: STORY-19-02
        title: In-App Notifications
        user_story: "As a user, I want to receive in-app notifications for real-time events so that I can respond quickly."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Caregiver receives in-app notification when booking request received (bell icon + count)
          - Care receiver receives in-app notification when caregiver accepts booking
          - Both parties receive in-app notification when new message received
          - Caregiver receives in-app notification when booking approaching (1 hour before start time)
          - Notifications dismissible (user can mark as read)
          - Notification history viewable (last 30 days)
          - Notifications cleared when user views relevant page (e.g., booking request notification cleared when user views booking requests page)

      - id: STORY-19-03
        title: Emergency Notifications (SMS)
        user_story: "As a user, I want to receive SMS notifications for emergencies so that I'm alerted immediately."
        priority: P0
        compliance_tags: [Safeguarding, Health & Safety]
        acceptance_criteria:
          - Family emergency contacts receive SMS when caregiver presses emergency button (see STORY-14-02)
          - Admin on-call receives SMS when critical safeguarding report submitted
          - Care receiver receives SMS when caregiver cancels booking less than 24 hours before start time
          - SMS includes brief message and link to platform for full details
          - SMS sent only for critical events (not promotional)
          - Users cannot opt out of emergency SMS (safeguarding requirement)
          - Audit log records all SMS sent with timestamp and recipient

  - id: EPIC-20
    title: Analytics & Reporting (Basic)
    system_code: SYS-20
    priority: P1
    capabilities:
      - Platform metrics dashboard (user counts, booking counts, revenue)
      - Safeguarding reports tracking
    stories:
      - id: STORY-20-01
        title: Platform Metrics Dashboard (Admin)
        user_story: "As an admin, I want to view platform health metrics so that I can monitor operations."
        priority: P1
        compliance_tags: [None]
        acceptance_criteria:
          - Dashboard shows total users (care receivers, caregivers, family members)
          - Dashboard shows active users (logged in last 30 days)
          - Dashboard shows total bookings (today, this week, this month, all time)
          - Dashboard shows total revenue (platform fees collected)
          - Dashboard shows average booking value
          - Dashboard shows caregiver retention rate (caregivers with 2+ bookings)
          - Dashboard shows care receiver retention rate (care receivers with 2+ bookings)
          - Metrics refreshed daily (overnight batch job)

      - id: STORY-20-02
        title: Safeguarding Reports Tracking
        user_story: "As an admin, I want to track safeguarding reports so that I can monitor platform safety."
        priority: P0
        compliance_tags: [Safeguarding, Care Act]
        acceptance_criteria:
          - Dashboard shows total safeguarding reports (this month, all time)
          - Dashboard shows reports by severity (critical, high, medium, low)
          - Dashboard shows reports by type (abuse, neglect, exploitation, coercion)
          - Dashboard shows average response time (time from report to admin review)
          - Dashboard shows external referrals count (SAB, police)
          - Dashboard shows user suspensions and bans count
          - Report exportable for compliance audits (CSV, PDF)

  - id: EPIC-21
    title: Content Management (Legal Documents)
    system_code: SYS-21
    priority: P0
    capabilities:
      - Public website content (homepage, how it works, pricing, FAQs)
      - Policy and legal documents (Terms of Service, Privacy Policy, Safeguarding Policy)
    stories:
      - id: STORY-21-01
        title: Public Website Content
        user_story: "As a visitor, I want to understand how the platform works so that I can decide if it's right for me."
        priority: P0
        compliance_tags: [Consumer Rights, Transparency]
        acceptance_criteria:
          - Homepage clearly explains platform value proposition (connect with qualified caregivers)
          - "How It Works" page explains process for care receivers (search, book, pay, review)
          - "How It Works" page explains process for caregivers (register, verify, accept bookings, get paid)
          - Pricing page clearly states platform fees (care receiver and caregiver fees)
          - FAQs page answers common questions (DBS checks, cancellation policy, payment timing, safeguarding)
          - Contact page provides email and phone number for support
          - All pages mobile-responsive and accessible (WCAG 2.1 AA)

      - id: STORY-21-02
        title: Terms of Service
        user_story: "As a user, I want to read Terms of Service so that I understand my rights and responsibilities."
        priority: P0
        compliance_tags: [Consumer Rights, GDPR]
        acceptance_criteria:
          - Terms clearly state platform is introduction service (not care provider)
          - Terms clearly state cancellation policy and refund rules
          - Terms clearly state user obligations (provide accurate information, treat users respectfully, pay on time)
          - Terms clearly state platform obligations (verify caregivers, protect user data, handle disputes fairly)
          - Terms clearly state limitation of liability
          - Terms clearly state dispute resolution process (admin review, then arbitration)
          - Terms written in plain English (readability score: Grade 8 or below)
          - Terms accessible from all pages (footer link)

      - id: STORY-21-03
        title: Privacy Policy
        user_story: "As a user, I want to read Privacy Policy so that I understand how my data is used."
        priority: P0
        compliance_tags: [GDPR]
        acceptance_criteria:
          - Privacy Policy explains what data collected (personal details, health data, payment data, usage data)
          - Privacy Policy explains why data collected (account management, booking processing, safeguarding, legal compliance)
          - Privacy Policy explains who data shared with (caregivers, payment processors, safeguarding authorities)
          - Privacy Policy explains data retention periods (7 years for most data, indefinite for safeguarding records)
          - Privacy Policy explains user rights (access, rectification, erasure, portability, complaint to ICO)
          - Privacy Policy explains cookies and analytics (see STORY-13-09)
          - Privacy Policy written in plain English
          - Privacy Policy accessible from all pages (footer link)

      - id: STORY-21-04
        title: Safeguarding Policy
        user_story: "As a user or regulator, I want to read Safeguarding Policy so that I understand platform's commitment to protecting vulnerable adults."
        priority: P0
        compliance_tags: [Care Act, Safeguarding]
        acceptance_criteria:
          - Safeguarding Policy defines safeguarding (prevention, detection, response to abuse/neglect)
          - Policy explains reporting mechanisms (safeguarding report button, message reporting, low rating escalation)
          - Policy explains investigation procedures (admin review, SAB referral, police referral)
          - Policy explains user responsibilities (report concerns, treat vulnerable adults with respect)
          - Policy explains platform responsibilities (verify caregivers, monitor for abuse, collaborate with authorities)
          - Policy includes contact details for safeguarding team
          - Policy accessible from all pages (footer link)

  - id: EPIC-22
    title: Technical Infrastructure
    system_code: SYS-22
    priority: P0
    capabilities:
      - Database architecture (PostgreSQL for user data, bookings, payments)
      - API architecture (RESTful API for frontend-backend communication)
      - Authentication and security (JWT tokens, encryption)
      - File storage (AWS S3 for profile photos, qualification certificates)
      - Email service (Transactional emails via SendGrid or AWS SES)
      - Payment processing (Stripe for payments and payouts)
      - Geolocation services (Google Maps API for location search)
      - Hosting and infrastructure (AWS, Heroku, or similar)
      - Accessibility (WCAG 2.1 AA compliance)
      - Mobile responsiveness
    stories:
      - id: STORY-22-01
        title: Database Architecture
        user_story: "As a platform, I want a reliable database so that user data is stored securely and retrieved efficiently."
        priority: P0
        compliance_tags: [GDPR, Security]
        acceptance_criteria:
          - PostgreSQL database for relational data (users, bookings, messages, payments)
          - Database hosted on secure cloud infrastructure (AWS RDS, managed backups)
          - Database encrypted at rest (AES-256 encryption)
          - Database backups automated (daily snapshots, 30-day retention)
          - Database access restricted to authorized services only (no public access)
          - Health data (medical conditions, care needs) encrypted with separate key
          - Database connection pooling for performance
          - Audit log table immutable (no DELETE or UPDATE permissions)

      - id: STORY-22-02
        title: API Architecture
        user_story: "As a frontend application, I want a RESTful API so that I can communicate with backend services."
        priority: P0
        compliance_tags: [Security]
        acceptance_criteria:
          - RESTful API endpoints for all user actions (registration, login, booking, messaging)
          - API secured with JWT authentication (tokens required for protected endpoints)
          - API rate limiting to prevent abuse (100 requests per minute per user)
          - API returns standardized error responses (HTTP status codes, error messages)
          - API documented with OpenAPI/Swagger specification
          - API versioned (v1 endpoints) for future compatibility
          - API hosted on secure HTTPS (TLS 1.2+)

      - id: STORY-22-03
        title: Authentication & Security
        user_story: "As a platform, I want robust authentication and security so that user accounts are protected."
        priority: P0
        compliance_tags: [GDPR, Security]
        acceptance_criteria:
          - Passwords hashed with bcrypt (cost factor: 10)
          - JWT tokens signed with secret key (256-bit)
          - JWT tokens expire after 24 hours (refresh tokens not implemented in MVP)
          - HTTPS enforced for all connections (redirect HTTP to HTTPS)
          - Security headers implemented (CSP, HSTS, X-Frame-Options)
          - SQL injection prevention (parameterized queries)
          - XSS prevention (input sanitization, output encoding)
          - CSRF protection (CSRF tokens for state-changing requests)

      - id: STORY-22-04
        title: File Storage (AWS S3)
        user_story: "As a platform, I want secure file storage so that user uploads (photos, documents) are stored reliably."
        priority: P0
        compliance_tags: [GDPR, Security]
        acceptance_criteria:
          - AWS S3 bucket for file uploads (profile photos, ID documents, qualification certificates)
          - Bucket access restricted (not publicly readable)
          - Files served via signed URLs (expire after 1 hour)
          - Files encrypted at rest (AWS S3 server-side encryption)
          - File upload size limits enforced (profile photo: 5MB, documents: 10MB)
          - File types restricted (JPEG, PNG, PDF only)
          - Malware scanning for uploaded files (AWS Lambda + ClamAV)
          - File retention follows data retention policy (deleted when user deleted)

      - id: STORY-22-05
        title: Email Service (Transactional)
        user_story: "As a platform, I want reliable email delivery so that users receive important notifications."
        priority: P0
        compliance_tags: [Consumer Rights, Distance Selling]
        acceptance_criteria:
          - Transactional email service (SendGrid, AWS SES, or similar)
          - Email templates for all transactional emails (booking confirmations, payment receipts, password resets)
          - Email deliverability monitoring (bounce rate, spam rate)
          - Email unsubscribe link for non-essential emails (GDPR compliance)
          - Email sending rate limits (prevent spam accusations)
          - Email authentication (SPF, DKIM, DMARC records configured)
          - Email tracking (open rates, click rates) for analytics

      - id: STORY-22-06
        title: Payment Processing (Stripe)
        user_story: "As a platform, I want secure payment processing so that users can pay and receive payouts safely."
        priority: P0
        compliance_tags: [Payment Services, PCI DSS]
        acceptance_criteria:
          - Stripe integration for payment processing (Stripe Elements for card input)
          - Stripe Connect for caregiver payouts (managed accounts)
          - Payment card details never stored on platform servers (Stripe tokenization)
          - Payment authorizations for bookings (hold funds until completion)
          - Payment captures on booking completion (transfer to escrow)
          - Payouts to caregivers after 48-hour escrow period
          - Refunds processed via Stripe Refunds API
          - Stripe webhooks for payment events (payment succeeded, payment failed, payout completed)

      - id: STORY-22-07
        title: Geolocation Services (Google Maps)
        user_story: "As a platform, I want geolocation services so that users can search for caregivers by location."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - Google Maps API for geocoding (convert postcode to coordinates)
          - Google Maps API for distance calculation (calculate distance between care receiver and caregiver)
          - Google Maps API for address autocomplete (user types address, suggestions appear)
          - Location data stored as coordinates (latitude, longitude) for efficient search
          - Search results filtered by radius (5, 10, 15, 20 miles)
          - API usage monitored (stay within free tier if possible)

      - id: STORY-22-08
        title: Accessibility (WCAG 2.1 AA)
        user_story: "As a user with disability, I want accessible platform so that I can use all features."
        priority: P0
        compliance_tags: [Equality Act, Accessibility]
        acceptance_criteria:
          - All pages keyboard navigable (tab order logical)
          - All images have alt text
          - Color contrast meets WCAG 2.1 AA standards (4.5:1 for normal text)
          - Form labels associated with inputs (screen reader compatible)
          - Error messages clear and actionable
          - Headings used semantically (H1, H2, H3 hierarchy)
          - ARIA labels for interactive elements (buttons, links)
          - Accessibility tested with screen reader (NVDA, JAWS)

      - id: STORY-22-09
        title: Mobile Responsiveness
        user_story: "As a user on mobile device, I want responsive design so that I can use platform on my phone or tablet."
        priority: P0
        compliance_tags: [None]
        acceptance_criteria:
          - All pages responsive (mobile, tablet, desktop breakpoints)
          - Mobile-first design (optimized for small screens)
          - Touch-friendly buttons (minimum 44x44 pixels)
          - Text readable without zooming (minimum 16px font size)
          - Forms optimized for mobile (large input fields, appropriate keyboard types)
          - Images optimized for mobile (reduced file sizes)
          - Tested on iOS Safari and Android Chrome

      - id: STORY-22-10
        title: Hosting & Infrastructure
        user_story: "As a platform, I want reliable hosting so that users can access platform 24/7."
        priority: P0
        compliance_tags: [Security, GDPR]
        acceptance_criteria:
          - Platform hosted on cloud infrastructure (AWS, Heroku, or similar)
          - Server infrastructure in UK or EU (GDPR data residency requirement)
          - HTTPS enforced (TLS 1.2+ certificate)
          - Load balancing for high availability (if traffic warrants)
          - Automated health checks (ping endpoints every 5 minutes)
          - Uptime monitoring (alert if downtime detected)
          - DDoS protection (CloudFlare or similar)
          - Infrastructure documented for disaster recovery

