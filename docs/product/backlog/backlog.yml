          - "User receives email on mobile device"
          - "Reads notification and clicks link to platform"
          - "Can unsubscribe from engagement emails via link"

        compliance_requirements:
          - "GDPR: Consent for marketing emails, easy unsubscribe"
          - "PECR: Opt-in for marketing"

        dependencies:
