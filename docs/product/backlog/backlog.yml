          so that we both benefit from a reward for growing the platform.

        description: |
          Incentivized referral program for both care receivers and caregivers
          with unique codes, tracking, and reward payouts.

        acceptance_criteria:
          - "Unique referral codes/links per user"
          - "Care receiver refers friend: Both get £20 credit after first booking"
          - "Caregiver refers caregiver: Referrer gets £50 after referee completes 5 bookings"
          - "Referral dashboard (track referrals and earnings)"
          - "Fraud prevention (same household, payment method detection)"

        user_journey:
          - "User navigates to Referrals page"
          - "Sees unique referral code/link"
          - "Shares with friend via email, SMS, or social media"
          - "Friend signs up using code"
          - "Friend completes qualifying action (first booking)"
          - "Both users receive reward (credit or cash)"
          - "Referrer can track referral status"

        compliance_requirements:
          - "Clear terms and conditions for referral program"
          - "Anti-fraud measures required"

        dependencies:
          - "Referral tracking system"
          - "Credit/payment system for rewards"

        success_metrics:
          - "Referral conversion rate: >30% of referred users sign up"
          - "Viral coefficient: Target >0.5 (each user refers 0.5 new users)"

        open_questions:
