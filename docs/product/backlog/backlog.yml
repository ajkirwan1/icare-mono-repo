          - "SMS template management"

        success_metrics:
          - "SMS delivery rate: >95%"
          - "SMS click-through rate: >40%"
          - "Opt-out rate: <10%"

      - id: FEAT-036
        name: "Push Notifications (Mobile App)"
        priority: P2
        status: not_started
        classification: Phase 2
        epic: "Growth & Retention"
        estimated_effort: 13

        user_story: |
          As a mobile app user, I want push notifications
          so that I receive instant updates about my bookings and messages.

        description: |
          Native mobile app development with push notification support for
          iOS and Android.

        acceptance_criteria:
