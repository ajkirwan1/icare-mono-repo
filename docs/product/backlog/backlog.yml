          so that I can understand the service and decide to sign up.

        description: |
          Marketing website with homepage, feature pages, pricing, trust & safety
          information, and SEO optimization for organic discovery.

        acceptance_criteria:
          - "Mobile-first design (60%+ of traffic expected on mobile)"
          - "Accessibility: WCAG 2.1 AA compliance"
          - "Clear CTAs on every page"
          - "Trust indicators: Verified Caregivers, Secure Payments, 24/7 Support"
          - "Local SEO optimized (UK cities/regions)"

        user_journey:
          - "Visitor searches 'elderly companionship London' on Google"
          - "Finds iCare website in search results"
          - "Lands on homepage"
          - "Reads value proposition and how it works"
          - "Clicks 'Find a Caregiver' or 'Become a Caregiver'"
          - "Redirected to registration"

        compliance_requirements:
          - "Accessibility standards: WCAG 2.1 AA"
          - "Cookie consent banner (PECR compliance)"

        dependencies:
          - "SEO basics: Meta tags, sitemap, schema.org markup"
          - "Analytics tracking (Google Analytics)"

        success_metrics:
          - "Organic search traffic: 40% of total traffic within 6 months"
