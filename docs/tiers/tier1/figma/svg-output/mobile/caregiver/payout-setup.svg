  <g transform="translate(0, 1048)"><line x1="0" y1="0" x2="375" y2="0" stroke="rgba(0, 0, 0, 0.06)" stroke-width="1"/><text x="16" y="16" font-family="Inter,sans-serif" font-size="12" fill="rgba(15, 23, 42, 0.72)">Privacy Policy</text><text x="203.5" y="16" font-family="Inter,sans-serif" font-size="12" fill="rgba(15, 23, 42, 0.72)">Terms of Service</text><text x="16" y="40" font-family="Inter,sans-serif" font-size="12" fill="rgba(15, 23, 42, 0.72)">Safeguarding</text><text x="203.5" y="40" font-family="Inter,sans-serif" font-size="12" fill="rgba(15, 23, 42, 0.72)">Contact Us</text><text x="16" y="64" font-family="Inter,sans-serif" font-size="12" fill="rgba(15, 23, 42, 0.72)">Help Centre</text><text x="187.5" y="104" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)" text-anchor="middle">© 2026 iCare Platform. All rights reserved.</text></g>
