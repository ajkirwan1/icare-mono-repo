  <g transform="translate(0, 208)"><rect x="16" y="0" width="343" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><circle cx="48" cy="40" r="14" fill="#f59e0b" opacity="0.2"/><text x="42" y="45" font-family="Inter,sans-serif" font-size="16">&#x26A0;</text><text x="72" y="28" font-family="Inter,sans-serif" font-size="15" font-weight="600" fill="#92400e">Bank account required</text><text x="72" y="48" font-family="Inter,sans-serif" font-size="13" fill="#92400e" opacity="0.85">You need to add a bank account to receive payouts. Set up your payout method to start earning.</text></g>
  <g transform="translate(0, 304)"><g transform="translate(16, 32)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="20.8" fill="#0f172a" font-weight="500">Payout Status</text></g><g transform="translate(16, 72)"><rect x="0" y="0" width="110" height="26" rx="13" fill="#f3f4f6"/><text x="12" y="17" font-family="Inter,sans-serif" font-size="12" font-weight="500" fill="rgba(15, 23, 42, 0.72)">&#x25CB; Not Connected</text><rect x="0" y="40" width="180" height="36" rx="8" fill="rgb(176, 196, 127)"/><text x="90" y="63" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Set Up Payouts</text></g></g>
