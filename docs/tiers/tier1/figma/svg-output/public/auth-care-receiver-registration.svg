, 310)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">First name *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">e.g., Margaret</text></g><g transform="translate(24, 390)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Last name *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">e.g., Johnson</text></g><g transform="translate(24, 470)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Email address *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">your.email@example.com</text></g><g transform="translate(24, 550)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Create a password *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">At least 8 characters</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">At least 8 characters, 1 uppercase, 1 number</text></g><g transform="translate(24, 646)"><rect x="0" y="0" width="345" height="8" rx="4" fill="#f59e0b"/><rect x="349" y="0" width="345" height="8" rx="4" fill="#f59e0b"/><rect x="698" y="0" width="345" height="8" rx="4" fill="#e5e7eb"/><rect x="1047" y="0" width="345" height="8" rx="4" fill="#e5e7eb"/><text x="0" y="24" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Fair</text></g><g transform="translate(24, 694)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Mobile phone number *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">07xxx xxxxxx</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">We'll send a verification code to this number</text></g><g transform="translate(24, 790)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Date of birth *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">DD/MM/YYYY</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">You must be 65 or over, or have documented care needs</text></g><g transform="translate(24, 886)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Postcode *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">e.g., SW1A 1AA</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">We'll show you caregivers in your area</text></g><g transform="translate(24, 982)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">EMERGENCY CONTACT</text></g><g transform="translate(24, 1026)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">This person 