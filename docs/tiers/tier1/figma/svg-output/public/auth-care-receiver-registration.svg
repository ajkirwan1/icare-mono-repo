y Policy</tspan> <tspan fill="#dc2626">*</tspan></text><rect x="0" y="72" width="18" height="18" rx="3" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="2"/><text x="26" y="86" font-family="Inter,sans-serif" font-size="14" fill="#0f172a">I'd like to receive helpful tips and updates via email</text></g><g transform="translate(24, 1430)"><rect x="0" y="0" width="200" height="40" rx="10" fill="rgb(176, 196, 127)" opacity="1"/><text x="100" y="25" font-family="Inter,sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">Create Account</text></g><g transform="translate(24, 1490)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16.8" fill="rgb(119, 141, 67)" text-decoration="underline">Already have an account? Log in →</text></g><g transform="translate(24, 1534)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgb(119, 141, 67)" text-decoration="underline">Register as a Caregiver instead →</text></g></g>
