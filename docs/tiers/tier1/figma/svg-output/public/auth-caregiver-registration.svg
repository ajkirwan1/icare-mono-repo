 rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">your.email@example.com</text></g><g transform="translate(24, 448)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Password *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">Create a strong password</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">At least 8 characters, including 1 uppercase letter and 1 number</text></g><g transform="translate(24, 544)"><rect x="0" y="0" width="345" height="8" rx="4" fill="#f59e0b"/><rect x="349" y="0" width="345" height="8" rx="4" fill="#f59e0b"/><rect x="698" y="0" width="345" height="8" rx="4" fill="#e5e7eb"/><rect x="1047" y="0" width="345" height="8" rx="4" fill="#e5e7eb"/><text x="0" y="24" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Fair</text></g><g transform="translate(24, 592)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Mobile number *</text><rect x="0" y="22" width="1392" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">07xxx xxxxxx</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">We'll send you a verification code</text></g><g transform="translate(24, 688)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)" font-weight="600">WHERE DO YOU WORK?</text></g><g transform="translate(24, 732)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a"