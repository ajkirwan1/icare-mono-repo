  <rect x="0" y="0" width="768" height="1828" fill="#f7f7f2"/>
  <g transform="translate(0, 0)"><rect width="768" height="64" fill="#ffffff"/><line x1="0" y1="64" x2="768" y2="64" stroke="rgba(0, 0, 0, 0.06)" stroke-width="1"/><rect x="24" y="14" width="100" height="36" rx="8" fill="rgb(176, 196, 127)" opacity="0.25"/><text x="46" y="38" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#0f172a">iCare</text><text x="744" y="38" font-family="Inter,sans-serif" font-size="14" fill="rgb(119, 141, 67)" text-anchor="end">Already have an account? Log in</text></g>
  <g transform="translate(0, 64)"><g transform="translate(24, 32)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="38.4" fill="#0f172a">Register on Behalf of a Family Member</text></g><g transform="translate(24, 76)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="19.52" fill="rgba(15, 23, 42, 0.72)">Create an account to manage care for your loved one</text></g><g transform="translate(24, 120)"><rect x="135" y="0" width="176" height="36" rx="18" fill="#dcfce7"/><text x="147" y="23" font-family="Inter,sans-serif" font-size="13" fill="#166534">🔒 256-bit Encrypted</text><rect x="323" y="0" width="152" height="36" rx="18" fill="#dcfce7"/><text x="335" y="23" font-family="Inter,sans-serif" font-size="13" fill="#166534">✓ GDPR Compliant</text><rect x="487" y="0" width="96" height="36" rx="18" fill="#dcfce7"/><text x="499" y="23" font-family="Inter,sans-serif" font-size="13" fill="#166534">🚫 No Spam</text></g><g transform="translate(24, 176)"><rect x="0" y="0" width="720" height="48" rx="8" fill="#dbeafe"/><text x="16" y="28" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#1e40af">You'll create accounts for yourself and your family member. You'll manage bookin</text></g><g transform="translate(24, 244)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">YOUR DETAILS (FAMILY MEMBER)</text></g><g transform="translate(24, 288)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">This is your login account</text></g><g transform="translate(24, 332)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Your full name *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">e.g., John Smith</text></g><g transform="translate(24, 412)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Your email *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">your.email@example.com</text></g><g transform="translate(24, 492)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Create a password *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">At least 8 characters</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">At least 8 characters, 1 uppercase, 1 number</text></g><g transform="translate(24, 588)"><rect x="0" y="0" width="177" height="8" rx="4" fill="#f59e0b"/><rect x="181" y="0" width="177" height="8" rx="4" fill="#f59e0b"/><rect x="362" y="0" width="177" height="8" rx="4" fill="#e5e7eb"/><rect x="543" y="0" width="177" height="8" rx="4" fill="#e5e7eb"/><text x="0" y="24" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Fair</text></g><g transform="translate(24, 636)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Your mobile number *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">07xxx xxxxxx</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">We'll send a verification code</text></g><g transform="translate(24, 732)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Your relationship to care receiver *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">Select relationship</text><text x="700" y="45" font-family="Inter,sans-serif" font-size="12" fill="rgba(15, 23, 42, 0.72)">&#x25BE;</text></g><g transform="translate(24, 812)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">CARE RECEIVER DETAILS</text></g><g transform="translate(24, 856)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">The person who will receive care</text></g><g transform="translate(24, 900)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Care receiver's name *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">e.g., Mary Johnson</text></g><g transform="translate(24, 980)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Date of birth *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">DD/MM/YYYY</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">Must be 65+ or have documented care needs</text></g><g transform="translate(24, 1076)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Postcode *</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">e.g., SW1A 1AA</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">We'll show local caregivers</text></g><g transform="translate(24, 1172)"><text x="0" y="14" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#0f172a">Care receiver's phone (optional)</text><rect x="0" y="22" width="720" height="36" rx="8" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1"/><text x="12" y="45" font-family="Inter,sans-serif" font-size="14" fill="rgba(15, 23, 42, 0.72)">07xxx xxxxxx</text><text x="0" y="62" font-family="Inter,sans-serif" font-size="11" fill="rgba(15, 23, 42, 0.72)">If different from yours</text></g><g transform="translate(24, 1268)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">EMERGENCY CONTACT</text></g><g transform="translate(24, 1312)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">This person will be contacted in case of emergency during care visits</text></g><g transform="translate(24, 1356)"><rect x="0" y="2" width="18" height="18" rx="4" fill="rgb(176, 196, 127)" stroke="rgb(176, 196, 127)" stroke-width="1.5"/><text x="4" y="16" font-family="Inter,sans-serif" font-size="14" fill="white">&#x2713;</text><text x="26" y="16" font-family="Inter,sans-serif" font-size="13" fill="#0f172a">Use my details as the emergency contact</text></g><g transform="translate(24, 1400)"><rect x="0" y="0" width="18" height="18" rx="3" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="2"/><text x="26" y="14" font-family="Inter,sans-serif" font-size="14" fill="#0f172a">I confirm I have the care receiver's consent to register on their behalf <tspan fill="#dc2626">*</tspan></text><rect x="0" y="36" width="18" height="18" rx="3" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="2"/><text x="26" y="50" font-family="Inter,sans-serif" font-size="14" fill="#0f172a">I accept the <tspan fill="#2563eb" text-decoration="underline">Terms of Service</tspan> <tspan fill="#dc2626">*</tspan></text><rect x="0" y="72" width="18" height="18" rx="3" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="2"/><text x="26" y="86" font-family="Inter,sans-serif" font-size="14" fill="#0f172a">I accept the <tspan fill="#2563eb" text-decoration="underline">Privacy Policy</tspan> <tspan fill="#dc2626">*</tspan></text><rect x="0" y="108" width="18" height="18" rx="3" fill="white" stroke="rgba(15, 23, 42, 0.10)" stroke-width="2"/><text x="26" y="122" font-family="Inter,sans-serif" font-size="14" fill="#0f172a">I'd like to receive helpful tips and updates via email</text></g><g transform="translate(24, 1556)"><rect x="0" y="0" width="200" height="40" rx="10" fill="rgb(176, 196, 127)" opacity="1"/><text x="100" y="25" font-family="Inter,sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">Create Accounts</text></g><g transform="translate(24, 1616)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16.8" fill="rgb(119, 141, 67)" text-decoration="underline">Already have an account? Log in →</text></g><g transform="translate(24, 1660)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgb(119, 141, 67)" text-decoration="underline">Register for yourself →</text></g></g>
  <g transform="translate(0, 1764)"><line x1="0" y1="0" x2="768" y2="0" stroke="rgba(0, 0, 0, 0.06)" stroke-width="1"/><text x="24" y="34" font-family="Inter,sans-serif" font-size="13" fill="rgba(15, 23, 42, 0.72)">Privacy Policy</text><text x="164" y="34" font-family="Inter,sans-serif" font-size="13" fill="rgba(15, 23, 42, 0.72)">Terms of Service</text><text x="304" y="34" font-family="Inter,sans-serif" font-size="13" fill="rgba(15, 23, 42, 0.72)">Safeguarding</text><text x="444" y="34" font-family="Inter,sans-serif" font-size="13" fill="rgba(15, 23, 42, 0.72)">Contact Us</text><text x="584" y="34" font-family="Inter,sans-serif" font-size="13" fill="rgba(15, 23, 42, 0.72)">Help Centre</text><text x="744" y="34" font-family="Inter,sans-serif" font-size="13" fill="rgba(15, 23, 42, 0.72)" text-anchor="end">© 2026 iCare Platform</text></g>
