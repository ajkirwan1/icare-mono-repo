  <g transform="translate(0, 698)"><rect x="24" y="0" width="1392" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><circle cx="56" cy="40" r="14" fill="#f59e0b" opacity="0.2"/><text x="50" y="45" font-family="Inter,sans-serif" font-size="16">&#x26A0;</text><text x="80" y="28" font-family="Inter,sans-serif" font-size="15" font-weight="600" fill="#92400e"></text><text x="80" y="48" font-family="Inter,sans-serif" font-size="13" fill="#92400e" opacity="0.85">This covers payment processing, insurance, and platform services. You'll receive 85% of each booking total.</text></g>
  <g transform="translate(0, 794)"><g transform="translate(24, 32)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgba(15, 23, 42, 0.72)">As a self-employed professional, you are responsible for reporting your earnings to HMRC.</text></g><g transform="translate(24, 64)"><text x="0" y="16" font-family="Inter,sans-serif" font-size="16" fill="rgb(119, 141, 67)" text-decoration="underline">Learn about self-employment tax obligations →</text></g></g>
