  <g transform="translate(0, 224)"><rect x="24" y="0" width="1392" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><circle cx="56" cy="40" r="14" fill="#f59e0b" opacity="0.2"/><text x="50" y="45" font-family="Inter,sans-serif" font-size="16">&#x26A0;</text><text x="80" y="28" font-family="Inter,sans-serif" font-size="15" font-weight="600" fill="#92400e"></text><text x="80" y="48" font-family="Inter,sans-serif" font-size="13" fill="#92400e" opacity="0.85">You need to add a bank account to receive payouts. Set up your payout method to start earning.</text></g>
