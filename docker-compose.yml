services:
  db:
    image: postgres:16
    container_name: icare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icare
      POSTGRES_PASSWORD: icare_password
      POSTGRES_DB: icare_dev
    ports:
      - "5432:5432"
    volumes:
      - icare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U icare -d icare_dev" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: DB admin UI in browser
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: icare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@icare.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  icare_pgdata:
