name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., abc123 or latest)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,TAG
          script: |
            set -e

            # Login to Docker Hub
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            # Pull images with specified tag
            docker pull ${DOCKERHUB_USERNAME}/icare-api:${TAG}
            docker pull ${DOCKERHUB_USERNAME}/icare-web:${TAG}

            # Update and restart containers
            cd /var/www/icare/docker
            export IMAGE_TAG=${TAG}
            export DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f

            echo "Deployed version: ${TAG}"

      - name: Summary
        run: |
          echo "### Deployed to DigitalOcean 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** \`${{ secrets.DOCKERHUB_USERNAME }}/icare-api:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** \`${{ secrets.DOCKERHUB_USERNAME }}/icare-web:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
