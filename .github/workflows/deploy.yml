name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., abc123 or latest)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment directory on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          debug: true
          script: |
            mkdir -p /var/www/icare/docker

      - name: Copy deployment files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          debug: true
          source: "docker/docker-compose.prod.yml,docker/Caddyfile"
          target: /var/www/icare
          strip_components: 0

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DO_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
          TAG: ${{ inputs.tag }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          debug: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DO_ACCESS_TOKEN,DO_REGISTRY_NAME,TAG
          script: |
            set -e

            # Login to Docker Hub (for web image)
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            # Login to DigitalOcean Container Registry (for API image)
            echo "${DO_ACCESS_TOKEN}" | docker login registry.digitalocean.com -u "${DO_ACCESS_TOKEN}" --password-stdin

            # Pull images with specified tag
            docker pull registry.digitalocean.com/${DO_REGISTRY_NAME}/icare-api:${TAG}
            docker pull ${DOCKERHUB_USERNAME}/icare-web:${TAG}

            # Update and restart containers
            cd /var/www/icare/docker
            export IMAGE_TAG=${TAG}
            export DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            export DO_REGISTRY_NAME=${DO_REGISTRY_NAME}
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f

            echo "Deployed version: ${TAG}"

      - name: Summary
        run: |
          echo "### Deployed to DigitalOcean 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** \`registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/icare-api:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** \`${{ secrets.DOCKERHUB_USERNAME }}/icare-web:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
