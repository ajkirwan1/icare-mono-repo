name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g., abc123 or latest)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory on droplet
        run: ssh -i ~/.ssh/deploy_key ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} "mkdir -p /var/www/icare/docker"

      - name: Copy deployment files to droplet
        run: scp -i ~/.ssh/deploy_key docker/docker-compose.prod.yml docker/Caddyfile ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/icare/docker/

      - name: Deploy to DigitalOcean
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'ENDSSH'
          set -e

          # Login to Docker Hub (for web image)
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # Login to DigitalOcean Container Registry (for API image)
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" --password-stdin

          # Pull images with specified tag
          docker pull registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/icare-api:${{ inputs.tag }}
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/icare-web:${{ inputs.tag }}

          # Update and restart containers
          cd /var/www/icare/docker
          export IMAGE_TAG=${{ inputs.tag }}
          export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          export DO_REGISTRY_NAME=${{ secrets.DO_REGISTRY_NAME }}
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d

          # Clean up old images
          docker image prune -f

          echo "Deployed version: ${{ inputs.tag }}"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Summary
        run: |
          echo "### Deployed to DigitalOcean 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** \`registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/icare-api:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** \`${{ secrets.DOCKERHUB_USERNAME }}/icare-web:${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
