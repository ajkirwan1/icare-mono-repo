services:
  # ---------- LOCAL: DB + pgAdmin only ----------
  db_local:
    image: postgres:16
    profiles: [ "localdb" ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - icare_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin_local:
    image: dpage/pgadmin4:8
    profiles: [ "localdb" ]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db_local:
        condition: service_healthy

  # ---------- PROD: full stack ----------
  db_prod:
    image: postgres:16
    profiles: [ "prod" ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # SSH tunnel access only
    volumes:
      - icare_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin_prod:
    image: dpage/pgadmin4:8
    profiles: [ "prod" ]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80" # SSH tunnel access only
    depends_on:
      db_prod:
        condition: service_healthy

  migrate:
    profiles: [ "prod" ]
    build: ../packages/ICare/express-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_prod:5432/${POSTGRES_DB}
    depends_on:
      db_prod:
        condition: service_healthy
    command: [ "node", "db/scripts/run-sql.js" ]
    restart: "no"

  api:
    profiles: [ "prod" ]
    build: ../packages/ICare/express-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_prod:5432/${POSTGRES_DB}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      db_prod:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4001"

  web:
    profiles: [ "prod" ]
    build:
      context: ..
      dockerfile: packages/ICare/app/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4001
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID}
      SANITY_DATASET: ${SANITY_DATASET}
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    profiles: [ "prod" ]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  icare_pgdata_local:
  icare_pgdata_prod:
  caddy_data:
  caddy_config:
