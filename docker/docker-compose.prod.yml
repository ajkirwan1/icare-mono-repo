# Production docker-compose - pulls pre-built images from Docker Hub
# Usage: IMAGE_TAG=abc123 DOCKERHUB_USERNAME=youruser docker compose -f docker-compose.prod.yml up -d
# Database: Uses managed DigitalOcean PostgreSQL (DATABASE_URL in .env.production)

services:
  migrate:
    image: registry.digitalocean.com/${DO_REGISTRY_NAME}/icare-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: [ "node", "db/scripts/run-sql.js" ]
    restart: "no"

  api:
    image: registry.digitalocean.com/${DO_REGISTRY_NAME}/icare-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4001"

  web:
    image: ${DOCKERHUB_USERNAME}/icare-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4001
      SANITY_PROJECT_ID: ${SANITY_PROJECT_ID}
      SANITY_DATASET: ${SANITY_DATASET}
      SANITY_API_VERSION: ${SANITY_API_VERSION}
      VITE_SANITY_PROJECT_ID: ${VITE_SANITY_PROJECT_ID}
      VITE_SANITY_DATASET: ${VITE_SANITY_DATASET}
      VITE_SANITY_API_VERSION: ${VITE_SANITY_API_VERSION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
